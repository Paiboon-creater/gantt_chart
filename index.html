<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAGUAR GANTT CHART // STOCK BOARD THEME</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030806;
            --panel-bg: rgba(7, 24, 16, 0.95);
            --border-neon: #00ff88;
            --border-dim: #17633c;
            --text-main: #f0fdf7;
            --text-label: #a7e0c4;
            --text-muted: #8ca89a;
            --neon-green: #00ff88;
            --neon-glow: rgba(0, 255, 136, 0.3);
            --neon-yellow: #f5a623;
            --neon-red: #ff3366;
            --input-bg: #112a1e;
            --input-text: #ffffff;
            --table-bg: #071910;
            --bar-planned: #113a24;
            --bar-actual: #00ff88;
            --cell-width: 28px; 
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px 15px;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(3, 8, 6, 0.95), rgba(5, 20, 12, 0.9)),
                        url('https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=1200&q=80') no-repeat center center;
            background-size: cover;
            z-index: -1;
            filter: brightness(0.3) contrast(1.2) hue-rotate(60deg);
        }

        .dashboard-container {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-dim);
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-dim);
            padding-bottom: 8px;
        }

        .filter-title {
            font-weight: bold;
            color: var(--neon-green);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .sync-status {
            font-size: 0.7rem;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 136, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--neon-green);
        }

        .filter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-group {
            flex: 1;
            min-width: 130px;
        }

        .filter-group label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-label);
            margin-bottom: 4px;
        }

        .form-select-stock {
            width: 100%;
            padding: 4px 8px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-dim);
            color: var(--input-text);
            border-radius: 4px;
            font-size: 0.8rem;
            outline: none;
        }

        .btn-action {
            background: #212529;
            color: #ced4da;
            border: 1px solid #495057;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action:hover {
            background: #343a40;
            color: #fff;
        }
        .btn-login {
            background: rgba(245, 166, 35, 0.1);
            color: var(--neon-yellow);
            border: 1px solid var(--neon-yellow);
        }
        .btn-login:hover {
            background: var(--neon-yellow);
            color: #000;
        }
        .btn-logout {
            background: rgba(255, 51, 102, 0.1);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
        }
        .btn-logout:hover {
            background: var(--neon-red);
            color: #fff;
        }

        .gantt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .gantt-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--neon-yellow);
        }

        .gantt-legend {
            display: flex;
            gap: 12px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .legend-item { display: flex; align-items: center; gap: 4px; }
        .box-planned { width: 10px; height: 10px; background: var(--bar-planned); border: 1px solid var(--border-dim); }
        .box-actual { width: 10px; height: 10px; background: var(--bar-actual); }
        .box-custom { width: 10px; height: 10px; background: #ff00ff; border: 1px solid #fff; }

        .gantt-container {
            width: 100%;
            overflow: auto;
            border: 1px solid var(--border-dim);
            background: var(--table-bg);
            max-height: 70vh;
            position: relative;
        }

        .gantt-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        .gantt-table th, .gantt-table td {
            border: 1px solid rgba(23, 99, 60, 0.4);
            padding: 4px 6px;
            text-align: center;
            color: var(--text-main);
            font-size: 0.75rem;
            height: 34px;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .gantt-table th {
            position: sticky;
            top: -1px; 
            z-index: 20; 
            background-color: #05140c;
        }

        .col-step { position: sticky; left: 0; background-color: #06170e; z-index: 11; min-width: 234px; max-width: 234px; border-right: 1px solid var(--border-dim); }
        .col-code { position: sticky; left: 234px; background-color: #06170e; z-index: 11; text-align: left; min-width: 170px; max-width: 170px; border-right: 1px solid var(--border-dim); }
        .col-progress { position: sticky; left: 404px; background-color: #06170e; z-index: 11; text-align: center; min-width: 260px; max-width: 260px; border-right: 1px solid var(--border-dim); }
        .col-start { position: sticky; left: 664px; background-color: #06170e; z-index: 11; text-align: center; min-width: 115px; max-width: 115px; border-right: 1px solid var(--border-dim); }
        .col-end { position: sticky; left: 779px; background-color: #06170e; z-index: 11; text-align: center; min-width: 115px; max-width: 115px; border-right: 2px solid var(--border-dim); }

        .gantt-table thead .col-step, 
        .gantt-table thead .col-code, 
        .gantt-table thead .col-progress,
        .gantt-table thead .col-start,
        .gantt-table thead .col-end {
            z-index: 30; 
            background-color: #030806;
            color: var(--neon-green);
        }

        tr:hover td.col-step, 
        tr:hover td.col-code, 
        tr:hover td.col-progress,
        tr:hover td.col-start,
        tr:hover td.col-end { background-color: #0b2e1c; }

        .table-hide-dates .col-start,
        .table-hide-dates .col-end { display: none !important; }
        .table-hide-dates .col-progress { border-right: 2px solid var(--border-dim) !important; }

        .date-header {
            min-width: var(--cell-width) !important;
            max-width: var(--cell-width) !important;
            width: var(--cell-width) !important;
            padding: 4px 0 !important;
            background-color: #05140c;
            color: #a7e0c4;
            font-size: 0.7rem;
            font-weight: bold;
            position: sticky;
            top: -1px;
            z-index: 20;
        }

        .step-name { font-weight: bold; color: var(--text-main); }
        .step-order { color: var(--neon-yellow); font-size: 0.75rem; }
        .work-code-text { color: #8ca89a; font-family: 'Courier New', monospace; font-size: 0.8rem; font-weight: bold; }

        .date-input {
            background: transparent;
            border: 1px solid transparent;
            color: var(--neon-yellow);
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            width: 100%;
            outline: none;
            text-align: center;
            cursor: pointer;
            border-radius: 3px;
        }
        .date-input:focus, .date-input:hover:not(:disabled) {
            border: 1px solid var(--border-dim);
            background-color: rgba(255, 255, 255, 0.05);
        }
        .date-input:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.8;
        }
        .date-input::-webkit-calendar-picker-indicator {
            filter: invert(1) sepia(1) saturate(5) hue-rotate(35deg);
            cursor: pointer;
        }
        .date-input:disabled::-webkit-calendar-picker-indicator {
            display: none;
        }

        .gantt-bar-wrapper {
            position: absolute;
            height: 20px;
            top: 6px;
            border-radius: 2px;
            z-index: 5;
            transition: box-shadow 0.2s, background-color 0.2s;
        }
        /* ชี้เมาส์เปลี่ยนเป็นลูกศรตอน Login แล้วเท่านั้น */
        .gantt-bar-wrapper.can-edit {
            cursor: pointer;
        }

        .bar-planned {
            position: absolute;
            left: 0; top: 0; height: 100%; width: 100%;
            background-color: var(--bar-planned);
            border-radius: 2px;
            z-index: 1;
        }

        .bar-actual {
            position: absolute;
            left: 0; top: 0; height: 100%;
            background-color: var(--bar-actual);
            border-radius: 2px;
            z-index: 2;
        }

        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            z-index: 3;
            color: #000;
            font-size: 0.65rem;
            font-weight: bold;
            line-height: 20px;
            pointer-events: none;
        }
        
        .bar-text.low-percent {
            color: var(--text-main);
            text-shadow: 1px 1px 1px #000;
        }

        .gantt-bar-wrapper.is-editing {
            z-index: 15 !important;
            box-shadow: 0 0 0 2px var(--neon-yellow), 0 0 10px rgba(245, 166, 35, 0.5);
            cursor: move;
        }

        .gantt-bar-wrapper.is-editing .bar-planned {
            background-color: rgba(245, 166, 35, 0.25);
        }

        .resize-handle {
            position: absolute;
            top: 0;
            width: 10px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.3);
            display: none;
            z-index: 10;
        }
        .resize-handle-left { left: 0; cursor: ew-resize; border-top-left-radius: 2px; border-bottom-left-radius: 2px; }
        .resize-handle-right { right: 0; cursor: ew-resize; border-top-right-radius: 2px; border-bottom-right-radius: 2px; }
        
        .gantt-bar-wrapper.is-editing .resize-handle { display: block; }

        #save-bar {
            position: fixed;
            bottom: -100px;
            left: 0;
            width: 100%;
            background: var(--neon-yellow);
            color: #000;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            border-top: 2px solid #fff;
        }
        #save-bar.show { bottom: 0; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="filter-header">
            <div class="filter-title">
                <i class="fa-solid fa-bars-progress"></i> JAGUAR GANTT CHART
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <div class="sync-status" id="syncIndicator" style="display:none;"></div>
                
                <button class="btn-action" id="btn-toggle-date" onclick="toggleDateColumns()">
                    <i class="fa-solid fa-eye-slash"></i> ซ่อนวันที่
                </button>
                <button class="btn-action" onclick="forceSync()">
                    <i class="fa-solid fa-rotate"></i> ดึงข้อมูล
                </button>
                <button class="btn-action btn-login" id="btn-login" onclick="toggleLogin()">
                    <i class="fa-solid fa-lock"></i> Login เพื่อแก้ไข
                </button>
            </div>
        </div>
        <div class="filter-grid">
            <div class="filter-group">
                <label>ช่วงเวลาเริ่ม (Date From):</label>
                <input type="date" id="filter_date_from" class="form-select-stock" onchange="resetLimitAndFilter()">
            </div>
            <div class="filter-group">
                <label>ช่วงเวลาถึง (Date To):</label>
                <input type="date" id="filter_date_to" class="form-select-stock" onchange="resetLimitAndFilter()">
            </div>
            <div class="filter-group">
                <label>Order No:</label>
                <select id="filter_order" class="form-select-stock" onchange="resetLimitAndFilter()">
                    <option value="">-- All Orders --</option>
                </select>
            </div>
            <div class="filter-group">
                <label>PO No:</label>
                <select id="filter_po" class="form-select-stock" onchange="resetLimitAndFilter()">
                    <option value="">-- All PO --</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Product Code:</label>
                <select id="filter_work" class="form-select-stock" onchange="resetLimitAndFilter()">
                    <option value="">-- All Products --</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Step:</label>
                <select id="filter_step" class="form-select-stock" onchange="resetLimitAndFilter()">
                    <option value="">-- All Steps --</option>
                </select>
            </div>
            <div class="filter-group" style="display: flex; align-items: flex-end;">
                <button class="btn-action" onclick="clearFilters()" style="width:100%; height: 32px;">RESET</button>
            </div>
        </div>
    </div>

    <div class="dashboard-container" style="padding: 0; border: none; background: transparent;">
        <div class="gantt-header" style="padding: 0 5px;">
            <div class="gantt-title" id="ganttChartTitle">> ภาพรวมแผนงาน</div>
            <div class="gantt-legend">
                <div class="legend-item"><div class="box-planned"></div> แผนงาน (Plan)</div>
                <div class="legend-item"><div class="box-actual"></div> ผลิตจริง (Actual)</div>
                <div class="legend-item"><div class="box-custom"></div> สีจุดสังเกตส่งของ (คลิกขวาเปลี่ยนสี)</div>
            </div>
        </div>
        
        <div class="gantt-container" id="ganttScrollArea">
            <table class="gantt-table" id="ganttTable">
                <thead id="ganttHead">
                    <!-- Thead โหลดโดย Javascript -->
                </thead>
                <tbody id="ganttBody">
                    <tr>
                        <td colspan="6" class="text-center py-4 text-muted">
                            <i class="fa-solid fa-spinner fa-spin me-2"></i> โหลดข้อมูล...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Floating Save Action Bar -->
    <div id="save-bar">
        <div class="d-flex align-items-center gap-3">
            <i class="fa-solid fa-triangle-exclamation fs-3"></i>
            <div>
                <h6 class="mb-0 fw-bold">คุณมีการแก้ไขแผนงาน (Unsaved Changes)</h6>
                <small class="opacity-75">ลากแท่งสีส้ม, ดึงขอบ หรือเลือกปฏิทินเพื่อเปลี่ยนวันที่</small>
            </div>
        </div>
        <div class="d-flex gap-2">
            <button onclick="cancelEdits()" class="btn btn-dark btn-sm fw-bold">ยกเลิก</button>
            <button onclick="saveEdits()" class="btn btn-light btn-sm fw-bold text-dark" id="btn-save-edits">
                <i class="fa-solid fa-floppy-disk me-1"></i> บันทึกข้อมูล
            </button>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
    const headers = { 
        "apikey": SUPABASE_KEY, 
        "Authorization": "Bearer " + SUPABASE_KEY, 
        "Content-Type": "application/json",
        "Prefer": "return=minimal" 
    };

    // ข้อมูลผู้ใช้งานที่สามารถแก้ไขได้
    const validUsers = {
        "admin": "112233",
        "user1": "@oh111",
        "user2": "@cat22",
        "user3": "@ann33",
        "user4": "@jai44",
        "user5": "@yuy55",
        "user6": "@boon6"
    };

    const STEP_ABBR_MAP = {
        "ตัดเหรียญมือ": "ตร.มือ", "ตัดเหรียญออโต": "ตร.ออโต", "ตัดมุม": "ตัดมุม", 
        "รีดใบ": "รีดใบ", "ตัดใบ": "ตัดใบ", "ตร.มือ": "ตร.มือ", "ตร.ออโต": "ตร.ออโต"
    };

    function getStepAbbr(name) {
        if(!name) return "";
        return STEP_ABBR_MAP[name.trim()] || name.trim();
    }

    function formatDateToLocal(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    let rawData = { orders: [], workItems: [], steps: [], targets: [], daily: [], orderSteps: [] };
    let maps = { workIdToCode: {}, stepIdToName: {}, targetIdToStepId: {}, workIdToStepIds: {} };
    
    const CELL_WIDTH = 28; 
    let localEdits = {}; 
    let customColors = JSON.parse(localStorage.getItem('jaguar_custom_colors') || '{}'); 
    let editingTaskId = null; 
    let currentMinDate = null; 
    let currentTotalDays = 0; 
    let isDateHidden = false; 
    
    // สถานะ Login และ ลิมิตข้อมูล
    let isLoggedIn = false;
    let currentUser = "";
    let displayLimit = 15; 

    window.onload = async function() {
        await fetchAllData();
        setupDragAndDrop();
        // เอาการโหลดอัตโนมัติ 5 วินาทีออกตามที่ขอ
    };

    // ฟังก์ชันจัดการ Login/Logout
    function toggleLogin() {
        const btn = document.getElementById('btn-login');
        if (isLoggedIn) {
            // Logout
            isLoggedIn = false;
            currentUser = "";
            btn.innerHTML = '<i class="fa-solid fa-lock"></i> Login เพื่อแก้ไข';
            btn.classList.remove('btn-logout');
            btn.classList.add('btn-login');
            cancelEdits(); // ยอมแพ้การแก้ไขทั้งหมดถ้ายกเลิก
            alert("ออกจากระบบแก้ไขเรียบร้อยแล้ว (Read-Only Mode)");
        } else {
            // Login
            let userInput = prompt("กรุณากรอก Username:");
            if (!userInput) return;
            let passInput = prompt("กรุณากรอก Password:");
            if (!passInput) return;

            if (validUsers[userInput] === passInput) {
                isLoggedIn = true;
                currentUser = userInput;
                btn.innerHTML = `<i class="fa-solid fa-unlock"></i> Logout (${currentUser})`;
                btn.classList.remove('btn-login');
                btn.classList.add('btn-logout');
                alert(`เข้าสู่ระบบสำเร็จ ยินดีต้อนรับคุณ ${currentUser}\nคุณสามารถลากกราฟ, เปลี่ยนวันที่, หรือเปลี่ยนสีแท่งได้แล้วครับ`);
                applyFilters(); // Re-render เพื่อเปิด input ให้แก้ไขได้
            } else {
                alert("Username หรือ Password ไม่ถูกต้อง!");
            }
        }
    }

    function toggleDateColumns() {
        isDateHidden = !isDateHidden;
        applyDateColumnVisibility();
    }

    function applyDateColumnVisibility() {
        const table = document.getElementById('ganttTable');
        const btn = document.getElementById('btn-toggle-date');
        if (!table || !btn) return;

        if (isDateHidden) {
            table.classList.add('table-hide-dates');
            btn.innerHTML = '<i class="fa-solid fa-calendar-days"></i> แสดงวันที่';
            btn.style.color = 'var(--neon-yellow)';
            btn.style.borderColor = 'var(--neon-yellow)';
        } else {
            table.classList.remove('table-hide-dates');
            btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> ซ่อนวันที่';
            btn.style.color = '#ced4da';
            btn.style.borderColor = '#495057';
        }
    }

    async function forceSync() {
        const btn = document.getElementById('syncIndicator');
        btn.style.display = 'flex';
        btn.innerHTML = '<i class="fa-solid fa-arrows-rotate fa-spin"></i> SYNC';
        btn.style.color = "var(--neon-yellow)";
        btn.style.borderColor = "var(--neon-yellow)";
        
        await fetchAllData();
        
        setTimeout(() => {
            btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> SYNC';
            btn.style.color = "var(--neon-green)";
            btn.style.borderColor = "var(--neon-green)";
            setTimeout(() => { btn.style.display = 'none'; }, 2000);
        }, 500);
    }

    async function fetchAllData() {
        try {
            const endpoints = [
                `${SUPABASE_URL}/orders?select=*`,
                `${SUPABASE_URL}/work_items?select=*`,
                `${SUPABASE_URL}/production_steps?select=*`,
                `${SUPABASE_URL}/targets?select=*`,
                `${SUPABASE_URL}/daily_production?select=id_order,id_target,produced_amount`,
                `${SUPABASE_URL}/order_steps?select=*`
            ];

            const responses = await Promise.all(endpoints.map(url => fetch(url, { headers })));
            const data = await Promise.all(responses.map(res => res.json()));

            rawData = { orders: data[0], workItems: data[1], steps: data[2], targets: data[3], daily: data[4], orderSteps: data[5] || [] };

            buildMaps();
            applyFilters();
        } catch (error) {
            console.error("Error:", error);
            alert("เกิดข้อผิดพลาดในการโหลดข้อมูลจาก Database");
        }
    }

    function buildMaps() {
        maps.workIdToCode = {}; rawData.workItems.forEach(w => maps.workIdToCode[w.id_work] = w.work_code);
        maps.stepIdToName = {}; rawData.steps.forEach(s => maps.stepIdToName[s.id_step] = s.step_name);
        maps.targetIdToStepId = {}; maps.workIdToStepIds = {};
        rawData.targets.forEach(t => {
            maps.targetIdToStepId[t.id_target] = t.id_step;
            if(!maps.workIdToStepIds[t.id_work]) maps.workIdToStepIds[t.id_work] = new Set();
            maps.workIdToStepIds[t.id_work].add(t.id_step);
        });
    }

    function populateDropdowns(fOrder = '', fPo = '', fWork = '', fStep = '') {
        const isMatch = (item, orderVal, poVal, workVal, stepVal) => {
            let wCode = maps.workIdToCode[item.id_work] ? String(maps.workIdToCode[item.id_work]).trim() : String(item.id_work);
            let matchOrder = !orderVal || (item.order_no && String(item.order_no).trim() === orderVal);
            let matchPo = !poVal || (item.po_no && String(item.po_no).trim() === poVal);
            let matchWork = !workVal || wCode === workVal;
            let matchStep = true;
            if(stepVal) {
                let sIds = maps.workIdToStepIds[item.id_work];
                matchStep = sIds && sIds.has(parseInt(stepVal));
            }
            return matchOrder && matchPo && matchWork && matchStep;
        };

        const validForOrder = rawData.orders.filter(i => isMatch(i, '', fPo, fWork, fStep));
        const validForPo = rawData.orders.filter(i => isMatch(i, fOrder, '', fWork, fStep));
        const validForWork = rawData.orders.filter(i => isMatch(i, fOrder, fPo, '', fStep));
        const validForStep = rawData.orders.filter(i => isMatch(i, fOrder, fPo, fWork, ''));

        const orders = [...new Set(validForOrder.map(i => i.order_no ? String(i.order_no).trim() : null).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'th', {numeric:true}));
        const pos = [...new Set(validForPo.map(i => i.po_no ? String(i.po_no).trim() : null).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'th', {numeric:true}));
        const works = [...new Set(validForWork.map(i => (maps.workIdToCode[i.id_work] || i.id_work) ? String(maps.workIdToCode[i.id_work] || i.id_work).trim() : null).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'th', {numeric:true}));

        let validStepIds = new Set();
        validForStep.forEach(o => { if(maps.workIdToStepIds[o.id_work]) maps.workIdToStepIds[o.id_work].forEach(id => validStepIds.add(id)); });
        const steps = [...validStepIds].map(id => ({ id: id, name: getStepAbbr(maps.stepIdToName[id]) })).filter(s => s.name).sort((a,b) => a.name.localeCompare(b.name, 'th'));

        const upd = (id, arr, def, val) => {
            let el = document.getElementById(id);
            if(document.activeElement === el) return; 
            el.innerHTML = `<option value="">${def}</option>` + arr.map(x => {
                let v = typeof x === 'object' ? x.id : x;
                let n = typeof x === 'object' ? x.name : x;
                return `<option value="${v}" ${String(v)===val?'selected':''}>${n}</option>`;
            }).join('');
        };

        upd('filter_order', orders, '-- All Orders --', fOrder);
        upd('filter_po', pos, '-- All PO --', fPo);
        upd('filter_work', works, '-- All Products --', fWork);
        upd('filter_step', steps, '-- All Steps --', fStep);
    }

    function resetLimitAndFilter() {
        displayLimit = 15; // รีเซ็ตการแสดงผลกลับไปเป็น 15 บรรทัดเมื่อเปลี่ยนฟิลเตอร์
        applyFilters();
    }

    function clearFilters() {
        ['filter_date_from', 'filter_date_to', 'filter_order','filter_po','filter_work','filter_step'].forEach(id => document.getElementById(id).value = '');
        resetLimitAndFilter();
    }

    function loadMore() {
        displayLimit += 15; // กดแล้วเพิ่มทีละ 15 บรรทัด
        applyFilters();
    }

    function handleDateChange(taskId, type, value) {
        if (!isLoggedIn) return; // บล็อกถ้าไม่ได้ล็อคอิน
        if (!value) return; 
        
        let startInput = document.getElementById(`start_${taskId}`).value;
        let endInput = document.getElementById(`end_${taskId}`).value;
        
        if (!localEdits[taskId]) {
            localEdits[taskId] = { startDate: startInput, endDate: endInput };
        }

        if (type === 'start') {
            localEdits[taskId].startDate = value;
            if (new Date(localEdits[taskId].endDate) < new Date(value)) {
                localEdits[taskId].endDate = value; 
            }
        } else {
            localEdits[taskId].endDate = value;
            if (new Date(localEdits[taskId].startDate) > new Date(value)) {
                localEdits[taskId].startDate = value; 
            }
        }
        
        startEditing(taskId); 
    }

    function applyFilters() {
        const fOrder = document.getElementById('filter_order').value;
        const fPo = document.getElementById('filter_po').value;
        const fWork = document.getElementById('filter_work').value;
        const fStep = document.getElementById('filter_step').value;
        
        populateDropdowns(fOrder, fPo, fWork, fStep);
        document.getElementById('ganttChartTitle').innerText = fWork ? `> แผนงานชิ้นงาน: ${fWork}` : (fOrder ? `> แผนงานใบสั่ง: ${fOrder}` : '> ภาพรวมแผนงานทั้งหมด');

        let filteredOrders = rawData.orders.filter(o => {
            let wCode = maps.workIdToCode[o.id_work] ? String(maps.workIdToCode[o.id_work]).trim() : String(o.id_work);
            let matchOrder = !fOrder || (o.order_no && String(o.order_no).trim() === fOrder);
            let matchPo = !fPo || (o.po_no && String(o.po_no).trim() === fPo);
            let matchWork = !fWork || wCode === fWork;
            let matchStep = !fStep || (maps.workIdToStepIds[o.id_work] && maps.workIdToStepIds[o.id_work].has(parseInt(fStep)));
            return matchOrder && matchPo && matchWork && matchStep;
        });

        renderGanttChart(filteredOrders, fStep);
    }

    function renderGanttChart(orders, filteredStepId) {
        const thead = document.getElementById('ganttHead');
        const tbody = document.getElementById('ganttBody');
        
        const fDateFrom = document.getElementById('filter_date_from').value;
        const fDateTo = document.getElementById('filter_date_to').value;

        if(orders.length === 0) {
            thead.innerHTML = `<tr>
                <th class="col-step">ขั้นตอน [Order]</th>
                <th class="col-code">รหัสชิ้นงาน</th>
                <th class="col-progress">ผลิตได้ / ยอดสั่ง / %</th>
                <th class="col-start">เริ่ม</th>
                <th class="col-end">เสร็จ</th>
            </tr>`;
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">ไม่พบข้อมูลตามเงื่อนไข</td></tr>`;
            applyDateColumnVisibility();
            return;
        }

        let rowsData = [];
        let minDate = new Date("2099-12-31");
        let maxDate = new Date("2000-01-01");

        orders.forEach(order => {
            let orderQty = order.quantity || 0;
            let stepIds = maps.workIdToStepIds[order.id_work]; 
            
            if (stepIds) {
                stepIds.forEach(stepId => {
                    if (filteredStepId && String(stepId) !== filteredStepId) return;
                    
                    let taskId = `${order.id_order}_${stepId}`; 
                    let oStep = rawData.orderSteps.find(os => os.id_order === order.id_order && os.id_step === stepId);
                    
                    let startDateStr = (localEdits[taskId] && localEdits[taskId].startDate) ? localEdits[taskId].startDate : ((oStep && oStep.start_date) ? oStep.start_date : order.start_date);
                    let endDateStr = (localEdits[taskId] && localEdits[taskId].endDate) ? localEdits[taskId].endDate : ((oStep && oStep.end_date) ? oStep.end_date : order.end_date);

                    if(!startDateStr || !endDateStr) return;

                    // การกรองข้อมูลวันที่ช่วงระยะเวลา (Date Range Filter)
                    if (fDateFrom && endDateStr < fDateFrom) return; 
                    if (fDateTo && startDateStr > fDateTo) return;

                    let sDate = new Date(startDateStr);
                    let eDate = new Date(endDateStr);
                    if (sDate < minDate) minDate = new Date(sDate);
                    if (eDate > maxDate) maxDate = new Date(eDate);

                    let actualTotal = 0;
                    rawData.daily.forEach(dp => {
                        if (dp.id_order === order.id_order && maps.targetIdToStepId[dp.id_target] === stepId) {
                            actualTotal += dp.produced_amount || 0;
                        }
                    });

                    let wCode = maps.workIdToCode[order.id_work] ? String(maps.workIdToCode[order.id_work]).trim() : (order.id_work || '-');

                    rowsData.push({
                        taskId: taskId,
                        order_id: order.id_order,
                        step_id: stepId,
                        order_no: order.order_no || 'N/A',
                        work_code: wCode,
                        step_name: getStepAbbr(maps.stepIdToName[stepId]) || 'Unknown',
                        target: orderQty,
                        actual: actualTotal,
                        startDate: sDate,
                        endDate: eDate,
                        startDateStr: startDateStr,
                        endDateStr: endDateStr
                    });
                });
            }
        });

        let orderMinDates = {};
        rowsData.forEach(r => {
            if (!orderMinDates[r.order_no] || r.startDate < orderMinDates[r.order_no]) {
                orderMinDates[r.order_no] = r.startDate;
            }
        });

        rowsData.sort((a, b) => {
            let minDateA = orderMinDates[a.order_no].getTime();
            let minDateB = orderMinDates[b.order_no].getTime();
            if (minDateA !== minDateB) {
                return minDateA - minDateB; 
            }
            let compOrder = String(a.order_no).localeCompare(String(b.order_no), 'th', { numeric: true });
            if (compOrder !== 0) return compOrder;
            
            if (a.startDate.getTime() !== b.startDate.getTime()) {
                return a.startDate.getTime() - b.startDate.getTime();
            }
            return a.step_name.localeCompare(b.step_name);
        });

        if (rowsData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">ไม่มีข้อมูลวันที่สำหรับแผนงานนี้</td></tr>`;
            applyDateColumnVisibility();
            return;
        }

        minDate.setDate(minDate.getDate() - 1);
        maxDate.setDate(maxDate.getDate() + 1);
        
        currentMinDate = new Date(minDate); 

        let dateHeaders = [];
        let curr = new Date(minDate);
        while (curr <= maxDate) {
            dateHeaders.push(new Date(curr));
            curr.setDate(curr.getDate() + 1);
        }
        currentTotalDays = dateHeaders.length;

        // Render Thead 
        let headHtml = `<tr>
            <th class="col-step">ขั้นตอน <span style="font-weight:normal; font-size:0.65rem;">[Order]</span></th>
            <th class="col-code">รหัสชิ้นงาน</th>
            <th class="col-progress">ผลิตได้ / ยอดสั่ง / %</th>
            <th class="col-start">เริ่ม</th>
            <th class="col-end">เสร็จ</th>`;
        dateHeaders.forEach(d => { 
            headHtml += `<th class="date-header">${d.getDate()}/${d.getMonth()+1}</th>`; 
        });
        headHtml += `</tr>`;
        thead.innerHTML = headHtml;

        let bodyHtml = '';
        
        // ตัดข้อมูลแสดงทีละชุดตาม limit
        const totalRows = rowsData.length;
        const paginatedRows = rowsData.slice(0, displayLimit);

        paginatedRows.forEach(row => {
            const offsetDays = Math.ceil(Math.abs(row.startDate - minDate) / 86400000);
            const durationDays = Math.ceil(Math.abs(row.endDate - row.startDate) / 86400000) + 1; 

            let realPercent = (row.target > 0) ? (row.actual / row.target) * 100 : 0;
            let percentWidth = Math.min(realPercent, 100); 
            
            let percentColor = "#ff3366"; 
            if (realPercent >= 100) {
                percentColor = "#00ff88"; 
            } else if (realPercent >= 50) {
                percentColor = "#f5a623"; 
            }

            let textClass = percentWidth < 20 ? "low-percent" : "";
            let isEditing = editingTaskId === row.taskId;
            let customBg = customColors[row.taskId] || ''; 
            
            // เช็คสถานะ Read-Only
            let readOnlyAttr = !isLoggedIn ? 'disabled' : '';
            let doubleClickAction = isLoggedIn ? `ondblclick="startEditing('${row.taskId}')"` : '';
            let rightClickAction = isLoggedIn ? `oncontextmenu="changeCustomColor(event, '${row.taskId}')"` : `oncontextmenu="event.preventDefault();"`;

            bodyHtml += `<tr>`;
            
            bodyHtml += `
                <td class="col-step" style="padding: 0 8px;">
                    <div style="display: grid; grid-template-columns: 90px auto; align-items: center; width: 100%; height: 100%;">
                        <span class="step-name" style="text-align: left;">${row.step_name}</span> 
                        <span class="step-order" style="text-align: left;">[${row.order_no}]</span>
                    </div>
                </td>
                <td class="col-code" style="padding: 0 8px; text-align: left;">
                    <span class="work-code-text" style="white-space: nowrap;">${row.work_code}</span>
                </td>
                <td class="col-progress" style="padding: 0; font-family: 'Courier New', monospace; font-size: 0.8rem; letter-spacing: -0.5px;">
                    <div style="display: grid; grid-template-columns: 75px 15px 75px 15px 55px; justify-content: center; align-items: center; width: 100%; height: 100%;">
                        <span style="color: var(--neon-green); font-weight: bold; text-align: right;">${row.actual.toLocaleString()}</span>
                        <span style="color: var(--text-muted); text-align: center;">/</span>
                        <span style="color: #ffffff; text-align: right;">${row.target.toLocaleString()}</span>
                        <span style="color: var(--text-muted); text-align: center;">/</span>
                        <span style="color: ${percentColor}; font-weight: bold; text-align: right;">${realPercent.toFixed(1)}%</span>
                    </div>
                </td>
                <td class="col-start" style="padding: 0 4px;">
                    <input type="date" class="date-input" id="start_${row.taskId}" value="${row.startDateStr}" onchange="handleDateChange('${row.taskId}', 'start', this.value)" ${readOnlyAttr}>
                </td>
                <td class="col-end" style="padding: 0 4px;">
                    <input type="date" class="date-input" id="end_${row.taskId}" value="${row.endDateStr}" onchange="handleDateChange('${row.taskId}', 'end', this.value)" ${readOnlyAttr}>
                </td>
            `;

            let totalGridWidth = currentTotalDays * CELL_WIDTH;
            bodyHtml += `
                <td colspan="${currentTotalDays}" style="padding: 0; min-width: ${totalGridWidth}px; max-width: ${totalGridWidth}px; position: relative;">
                    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
                                background: repeating-linear-gradient(to right, transparent, transparent ${CELL_WIDTH - 1}px, rgba(23,99,60,0.4) ${CELL_WIDTH - 1}px, rgba(23,99,60,0.4) ${CELL_WIDTH}px);">
                    </div>
                    
                    <div class="gantt-bar-wrapper ${isEditing ? 'is-editing' : ''} ${isLoggedIn ? 'can-edit' : ''}" 
                         data-taskid="${row.taskId}"
                         ${doubleClickAction}
                         ${rightClickAction}
                         style="left: ${offsetDays * CELL_WIDTH}px; width: ${durationDays * CELL_WIDTH}px; ${customBg ? 'background-color: ' + customBg + ';' : ''}">
                        
                        <div class="bar-planned" ${customBg ? 'style="background-color: ' + customBg + ';"' : ''}></div>
                        <div class="bar-actual" style="width: ${percentWidth}%;"></div>
                        <div class="bar-text ${textClass}">${percentWidth.toFixed(0)}%</div>
                        
                        ${(isEditing && isLoggedIn) ? `
                            <div class="resize-handle resize-handle-left" data-action="resize-left"></div>
                            <div class="resize-handle resize-handle-right" data-action="resize-right"></div>
                        ` : ''}
                    </div>
                </td>
            `;
            
            bodyHtml += `</tr>`;
        });

        // ปุ่มโหลดข้อมูลเพิ่ม หากข้อมูลมีมากกว่า 15 แถว
        if (totalRows > displayLimit) {
            let remain = totalRows - displayLimit;
            bodyHtml += `
                <tr>
                    <td colspan="5" class="text-center" style="padding: 10px;">
                        <button class="btn-action" onclick="loadMore()" style="width: 250px;">
                            <i class="fa-solid fa-angles-down"></i> แสดงข้อมูลเพิ่มเติมอีก (${remain} รายการ)
                        </button>
                    </td>
                    <td colspan="${currentTotalDays}"></td>
                </tr>
            `;
        }

        tbody.innerHTML = bodyHtml;

        applyDateColumnVisibility();
    }

    function changeCustomColor(e, taskId) {
        if (!isLoggedIn) return; // บล็อกถ้าไม่ได้ Login
        e.preventDefault(); 
        let colors = ['', '#ff3366', '#f5a623', '#00ff88', '#00ffff', '#ff00ff', '#ffffff'];
        let currentColor = customColors[taskId] || '';
        let nextIndex = (colors.indexOf(currentColor) + 1) % colors.length;
        let newColor = colors[nextIndex];

        if (newColor === '') {
            delete customColors[taskId];
        } else {
            customColors[taskId] = newColor;
        }

        localStorage.setItem('jaguar_custom_colors', JSON.stringify(customColors));
        applyFilters(); 
    }

    function startEditing(taskId) {
        if (!isLoggedIn) return; // บล็อกถ้าไม่ได้ Login
        editingTaskId = taskId;
        applyFilters(); 
        document.getElementById('save-bar').classList.add('show');
    }

    function cancelEdits() {
        editingTaskId = null;
        localEdits = {}; 
        applyFilters();
        document.getElementById('save-bar').classList.remove('show');
    }

    async function saveEdits() {
        if (!isLoggedIn) return;
        if (Object.keys(localEdits).length === 0) {
            cancelEdits();
            return;
        }

        const btnSave = document.getElementById('btn-save-edits');
        const originalText = btnSave.innerHTML;
        btnSave.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-1"></i> กำลังบันทึก...`;
        btnSave.disabled = true;

        try {
            const updatePromises = Object.entries(localEdits).map(async ([taskId, dates]) => {
                const [orderIdStr, stepIdStr] = taskId.split('_');
                const orderId = parseInt(orderIdStr);
                const stepId = parseInt(stepIdStr);

                const url = `${SUPABASE_URL}/order_steps`;
                const payload = {
                    id_order: orderId,
                    id_step: stepId,
                    start_date: dates.startDate,
                    end_date: dates.endDate
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        ...headers,
                        "Prefer": "resolution=merge-duplicates" 
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Failed to save Task ID: ${taskId}`);
                }
            });

            await Promise.all(updatePromises);
            
            alert('บันทึกข้อมูลวันที่สำเร็จแล้ว');
            
            editingTaskId = null;
            localEdits = {}; 
            document.getElementById('save-bar').classList.remove('show');
            
            // ดึงข้อมูลใหม่เพื่อซิงค์
            forceSync();
            
        } catch (error) {
            console.error("Error saving edits:", error);
            alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง');
        } finally {
            btnSave.innerHTML = originalText;
            btnSave.disabled = false;
        }
    }

    function setupDragAndDrop() {
        const container = document.getElementById('ganttBody');
        let isDragging = false;
        let currentAction = null; 
        let activeElement = null;
        let startMouseX = 0;
        let initialLeft = 0;
        let initialWidth = 0;
        let activeTaskId = null;

        container.addEventListener('mousedown', (e) => {
            if (!isLoggedIn) return; // บล็อกถ้าไม่ได้ล็อคอิน
            if (!editingTaskId) return; 
            
            const wrapper = e.target.closest('.is-editing');
            if (!wrapper) return;

            activeElement = wrapper;
            activeTaskId = wrapper.dataset.taskid;
            isDragging = true;
            startMouseX = e.clientX;
            
            initialLeft = parseInt(wrapper.style.left) || 0;
            initialWidth = parseInt(wrapper.style.width) || 0;

            if (e.target.classList.contains('resize-handle-left')) {
                currentAction = 'resize-left';
            } else if (e.target.classList.contains('resize-handle-right')) {
                currentAction = 'resize-right';
            } else {
                currentAction = 'move';
            }
            
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging || !activeElement || !isLoggedIn) return;

            const dx = e.clientX - startMouseX;
            const maxAllowedWidth = currentTotalDays * CELL_WIDTH;
            
            if (currentAction === 'move') {
                let newLeft = initialLeft + dx;
                newLeft = Math.max(0, Math.min(newLeft, maxAllowedWidth - initialWidth));
                activeElement.style.left = `${newLeft}px`;
            } 
            else if (currentAction === 'resize-left') {
                let newLeft = initialLeft + dx;
                let newWidth = initialWidth - dx;
                
                if (newWidth >= CELL_WIDTH && newLeft >= 0) {
                    activeElement.style.left = `${newLeft}px`;
                    activeElement.style.width = `${newWidth}px`;
                }
            } 
            else if (currentAction === 'resize-right') {
                let newWidth = initialWidth + dx;
                if (newWidth >= CELL_WIDTH && (initialLeft + newWidth) <= maxAllowedWidth) {
                    activeElement.style.width = `${newWidth}px`;
                }
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (!isDragging || !isLoggedIn) return;
            isDragging = false;
            document.body.style.userSelect = '';

            const currentLeft = parseInt(activeElement.style.left);
            const currentWidth = parseInt(activeElement.style.width);
            
            const snappedOffset = Math.round(currentLeft / CELL_WIDTH);
            const snappedDuration = Math.max(1, Math.round(currentWidth / CELL_WIDTH));
            
            activeElement.style.left = `${snappedOffset * CELL_WIDTH}px`;
            activeElement.style.width = `${snappedDuration * CELL_WIDTH}px`;

            if (activeTaskId && currentMinDate) {
                let newStartDate = new Date(currentMinDate);
                newStartDate.setDate(currentMinDate.getDate() + snappedOffset);
                
                let newEndDate = new Date(newStartDate);
                newEndDate.setDate(newStartDate.getDate() + snappedDuration - 1);
                
                const startStr = formatDateToLocal(newStartDate);
                const endStr = formatDateToLocal(newEndDate);
                
                localEdits[activeTaskId] = {
                    startDate: startStr,
                    endDate: endStr
                };
                
                const startInput = document.getElementById(`start_${activeTaskId}`);
                const endInput = document.getElementById(`end_${activeTaskId}`);
                if(startInput) startInput.value = startStr;
                if(endInput) endInput.value = endStr;
            }

            activeElement = null;
            currentAction = null;
        });
    }
</script>
