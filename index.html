<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAGUAR GANTT CHART // STOCK BOARD THEME</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f1714;
            --panel-bg: rgba(18, 28, 24, 0.95);
            --border-neon: #4ade80;
            --border-dim: #273f34;
            --text-main: #e2e8e4;
            --text-label: #8ba898;
            --text-muted: #627d6d;
            --neon-green: #4ade80;
            --neon-glow: rgba(74, 222, 128, 0.15);
            --neon-yellow: #fbbf24;
            --input-bg: #16241e;
            --input-text: #ffffff;
            --table-bg: #101915;
            --bar-planned: #1d3629;
            --bar-actual: #4ade80;
            --cell-width: 20px; /* ลดขนาดจาก 40px เหลือ 20px (ครึ่งหนึ่ง) */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px 15px;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(15, 23, 20, 0.95), rgba(18, 28, 24, 0.9)),
                        url('https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=1200&q=80') no-repeat center center;
            background-size: cover;
            z-index: -1;
            filter: brightness(0.25) contrast(1.1) hue-rotate(60deg);
        }

        .dashboard-container {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-dim);
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        /* Filter Section */
        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-dim);
            padding-bottom: 8px;
        }

        .filter-title {
            font-weight: bold;
            color: var(--neon-green);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .sync-status {
            font-size: 0.7rem;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 136, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--neon-green);
        }

        .filter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-group {
            flex: 1;
            min-width: 150px;
        }

        .filter-group label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-label);
            margin-bottom: 4px;
        }

        .form-select-stock {
            width: 100%;
            padding: 4px 8px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-dim);
            color: var(--input-text);
            border-radius: 4px;
            font-size: 0.8rem;
            outline: none;
        }

        .btn-reset {
            background: #212529;
            color: #ced4da;
            border: 1px solid #495057;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* Gantt Chart Area */
        .gantt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .gantt-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--neon-yellow);
        }

        .gantt-legend {
            display: flex;
            gap: 12px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .legend-item { display: flex; align-items: center; gap: 4px; }
        .box-planned { width: 10px; height: 10px; background: var(--bar-planned); border: 1px solid var(--border-dim); }
        .box-actual { width: 10px; height: 10px; background: var(--bar-actual); }

        .gantt-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-dim);
            background: var(--table-bg);
            max-height: 70vh;
            position: relative;
        }

        .gantt-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        .gantt-table th, .gantt-table td {
            border: 1px solid rgba(39, 63, 52, 0.4);
            padding: 4px 6px;
            text-align: center;
            color: var(--text-main);
            font-size: 0.75rem;
            height: 32px; /* Set fixed row height */
            white-space: nowrap;
            box-sizing: border-box;
        }

        .gantt-table th {
            background-color: #121e18;
            color: var(--text-label);
            font-size: 0.7rem;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Fixed Date Header Width */
        .date-header {
            min-width: var(--cell-width) !important;
            max-width: var(--cell-width) !important;
            width: var(--cell-width) !important;
            padding: 4px 0 !important;
            font-size: 0.55rem !important; /* ปรับขนาดอักษรให้เล็กลงเพื่อให้พอดีช่อง 20px */
            letter-spacing: -0.5px;
        }

        /* ----- การตั้งค่า Sticky คอลัมน์ที่ 1, 2 และ 3 ----- */
        .gantt-table th:nth-child(1), .gantt-table td:nth-child(1) {
            position: sticky; left: 0; background-color: #16241e; z-index: 11;
            min-width: 170px; max-width: 170px; border-right: 1px solid var(--border-dim);
        }
        .gantt-table th:nth-child(2), .gantt-table td:nth-child(2) {
            position: sticky; left: 170px; background-color: #16241e; z-index: 11;
            text-align: left; min-width: 130px; max-width: 130px; border-right: 1px solid var(--border-dim);
        }
        .gantt-table th:nth-child(3), .gantt-table td:nth-child(3) {
            position: sticky; left: 300px; background-color: #16241e; z-index: 11;
            text-align: center; min-width: 220px; max-width: 220px; border-right: 2px solid var(--border-dim);
        }

        .gantt-table thead th:nth-child(1), 
        .gantt-table thead th:nth-child(2), 
        .gantt-table thead th:nth-child(3) {
            z-index: 12;
            background-color: #0f1714;
            color: var(--neon-green);
        }

        tr:hover td { background-color: rgba(74, 222, 128, 0.08); }
        tr:hover td:nth-child(1), 
        tr:hover td:nth-child(2), 
        tr:hover td:nth-child(3) { background-color: #1c3026; }

        .step-name { font-weight: bold; color: var(--text-main); }
        .step-order { color: var(--neon-yellow); font-size: 0.7rem; }
        .work-code-text { color: #8ca89a; font-family: 'Courier New', monospace; font-size: 0.75rem; font-weight: bold; }

        /* แถบกราฟ Gantt (Interactive Version) */
        .gantt-bar-wrapper {
            position: absolute;
            height: 20px;
            top: 5px; /* Center inside 32px height row */
            border-radius: 2px;
            cursor: pointer;
            z-index: 5;
            transition: box-shadow 0.2s, background-color 0.2s;
        }

        .bar-planned {
            position: absolute;
            left: 0; top: 0; height: 100%; width: 100%;
            background-color: var(--bar-planned);
            border-radius: 2px;
            z-index: 1;
        }

        .bar-actual {
            position: absolute;
            left: 0; top: 0; height: 100%;
            background-color: var(--bar-actual);
            border-radius: 2px;
            z-index: 2;
        }

        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            z-index: 3;
            color: #052e16;
            font-size: 0.55rem; /* ปรับขนาดตัวเลข % ให้เล็กลงเล็กน้อย */
            font-weight: bold;
            line-height: 20px;
            pointer-events: none; /* Prevent text selection while dragging */
            overflow: hidden;
        }
        
        .bar-text.low-percent {
            color: var(--text-main);
            text-shadow: 1px 1px 1px #000;
        }

        /* Editing State Styles */
        .gantt-bar-wrapper.is-editing {
            z-index: 50 !important;
            box-shadow: 0 0 0 2px var(--neon-yellow), 0 0 10px rgba(245, 166, 35, 0.5);
            cursor: move;
        }

        .gantt-bar-wrapper.is-editing .bar-planned {
            background-color: rgba(245, 166, 35, 0.25); /* Tint to orange when editing */
        }

        /* Resize Handles */
        .resize-handle {
            position: absolute;
            top: 0;
            width: 10px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.3);
            display: none;
            z-index: 10;
        }
        .resize-handle-left { left: 0; cursor: ew-resize; border-top-left-radius: 2px; border-bottom-left-radius: 2px; }
        .resize-handle-right { right: 0; cursor: ew-resize; border-top-right-radius: 2px; border-bottom-right-radius: 2px; }
        
        .gantt-bar-wrapper.is-editing .resize-handle {
            display: block;
        }

        /* Save Action Bar */
        #save-bar {
            position: fixed;
            bottom: -100px;
            left: 0;
            width: 100%;
            background: var(--neon-yellow);
            color: #000;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            border-top: 2px solid #fff;
        }
        #save-bar.show {
            bottom: 0;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="filter-header">
            <div class="filter-title">
                <i class="fa-solid fa-bars-progress"></i> JAGUAR GANTT CHART
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="sync-status" id="syncIndicator">
                    <i class="fa-solid fa-circle-check"></i> SYNC
                </div>
                <button class="btn-reset" onclick="clearFilters()">RESET</button>
            </div>
        </div>
        <div class="filter-grid">
            <div class="filter-group">
                <label>Order No:</label>
                <select id="filter_order" class="form-select-stock" onchange="applyFilters()">
                    <option value="">-- All Orders --</option>
                </select>
            </div>
            <div class="filter-group">
                <label>PO No:</label>
                <select id="filter_po" class="form-select-stock" onchange="applyFilters()">
                    <option value="">-- All PO --</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Product Code:</label>
                <select id="filter_work" class="form-select-stock" onchange="applyFilters()">
                    <option value="">-- All Products --</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Step:</label>
                <select id="filter_step" class="form-select-stock" onchange="applyFilters()">
                    <option value="">-- All Steps --</option>
                </select>
            </div>
        </div>
    </div>

    <div class="dashboard-container" style="padding: 0; border: none; background: transparent;">
        <div class="gantt-header" style="padding: 0 5px;">
            <div class="gantt-title" id="ganttChartTitle">> ภาพรวมแผนงาน</div>
            <div class="gantt-legend">
                <div class="legend-item"><div class="box-planned"></div> แผนงาน (Plan)</div>
                <div class="legend-item"><div class="box-actual"></div> ผลิตจริง (Actual)</div>
            </div>
        </div>
        
        <div class="gantt-container" id="ganttScrollArea">
            <table class="gantt-table" id="ganttTable">
                <thead id="ganttHead">
                    <tr>
                        <th style="min-width: 170px;">ขั้นตอน [Order]</th>
                        <th style="min-width: 130px;">รหัสชิ้นงาน</th>
                        <th style="min-width: 220px;">ผลิตได้ / ยอดสั่ง / %</th>
                        <th>...</th>
                    </tr>
                </thead>
                <tbody id="ganttBody">
                    <tr>
                        <td colspan="4" class="text-center py-4 text-muted">
                            <i class="fa-solid fa-spinner fa-spin me-2"></i> โหลดข้อมูล...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Floating Save Action Bar -->
    <div id="save-bar">
        <div class="d-flex align-items-center gap-3">
            <i class="fa-solid fa-triangle-exclamation fs-3"></i>
            <div>
                <h6 class="mb-0 fw-bold">คุณมีการแก้ไขแผนงาน (Unsaved Changes)</h6>
                <small class="opacity-75">ลากแท่งสีส้มเพื่อเปลี่ยนวันที่ หรือดึงขอบเพื่อยืดหดระยะเวลา</small>
            </div>
        </div>
        <div class="d-flex gap-2">
            <button onclick="cancelEdits()" class="btn btn-dark btn-sm fw-bold">ยกเลิก</button>
            <button onclick="saveEdits()" class="btn btn-light btn-sm fw-bold text-dark" id="btn-save-edits">
                <i class="fa-solid fa-floppy-disk me-1"></i> บันทึกข้อมูล
            </button>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
    const headers = { 
        "apikey": SUPABASE_KEY, 
        "Authorization": "Bearer " + SUPABASE_KEY, 
        "Content-Type": "application/json",
        "Prefer": "return=minimal" // แนะนำให้ใส่สำหรับการทำ UPDATE
    };

    const STEP_ABBR_MAP = {
        "ตัดเหรียญมือ": "ตร.มือ", "ตัดเหรียญออโต": "ตร.ออโต", "ตัดมุม": "ตัดมุม", 
        "รีดใบ": "รีดใบ", "ตัดใบ": "ตัดใบ", "ตร.มือ": "ตร.มือ", "ตร.ออโต": "ตร.ออโต"
    };

    function getStepAbbr(name) {
        if(!name) return "";
        return STEP_ABBR_MAP[name.trim()] || name.trim();
    }

    let rawData = { orders: [], workItems: [], steps: [], targets: [], daily: [], orderSteps: [] };
    let maps = { workIdToCode: {}, stepIdToName: {}, targetIdToStepId: {}, workIdToStepIds: {} };
    
    // State สำหรับการแก้ไข Drag & Drop
    const CELL_WIDTH = 20; // ลดขนาดจาก 40 เป็น 20 เพื่อให้คำนวณการ Snap ได้ถูกต้อง
    let localEdits = {}; // เก็บข้อมูลการแก้ไขชั่วคราว { taskId: { startDate, endDate } }
    let editingTaskId = null; // ID ของ task ที่กำลังถูกแก้ไข
    let currentMinDate = null; // เก็บ minDate ของกระดานปัจจุบันใช้อ้างอิงตอนลาก
    let currentTotalDays = 0; // เก็บจำนวนวันทั้งหมดในกระดาน

    window.onload = async function() {
        await fetchAllData();
        setupDragAndDrop(); // กำหนด Event Listener สำหรับลากวาง
        // ปิด Auto Sync ชั่วคราวเพื่อไม่ให้ขัดขวางการลากแก้ไข
        // setInterval(fetchAllData, 30000); 
    };

    async function fetchAllData() {
        try {
            document.getElementById('syncIndicator').innerHTML = '<i class="fa-solid fa-arrows-rotate fa-spin"></i> SYNC';
            document.getElementById('syncIndicator').style.borderColor = "var(--neon-yellow)";
            document.getElementById('syncIndicator').style.color = "var(--neon-yellow)";

            const endpoints = [
                `${SUPABASE_URL}/orders?select=*`,
                `${SUPABASE_URL}/work_items?select=*`,
                `${SUPABASE_URL}/production_steps?select=*`,
                `${SUPABASE_URL}/targets?select=*`,
                `${SUPABASE_URL}/daily_production?select=id_order,id_target,produced_amount`,
                `${SUPABASE_URL}/order_steps?select=*`
            ];

            const responses = await Promise.all(endpoints.map(url => fetch(url, { headers })));
            const data = await Promise.all(responses.map(res => res.json()));

            rawData = { orders: data[0], workItems: data[1], steps: data[2], targets: data[3], daily: data[4], orderSteps: data[5] || [] };

            buildMaps();
            applyFilters();

            setTimeout(() => {
                document.getElementById('syncIndicator').innerHTML = '<i class="fa-solid fa-circle-check"></i> SYNC';
                document.getElementById('syncIndicator').style.borderColor = "var(--neon-green)";
                document.getElementById('syncIndicator').style.color = "var(--neon-green)";
            }, 1000);

        } catch (error) {
            console.error("Error:", error);
            document.getElementById('syncIndicator').innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ERR';
            document.getElementById('syncIndicator').style.color = "#ff3366";
        }
    }

    function buildMaps() {
        maps.workIdToCode = {}; rawData.workItems.forEach(w => maps.workIdToCode[w.id_work] = w.work_code);
        maps.stepIdToName = {}; rawData.steps.forEach(s => maps.stepIdToName[s.id_step] = s.step_name);
        maps.targetIdToStepId = {}; maps.workIdToStepIds = {};
        rawData.targets.forEach(t => {
            maps.targetIdToStepId[t.id_target] = t.id_step;
            if(!maps.workIdToStepIds[t.id_work]) maps.workIdToStepIds[t.id_work] = new Set();
            maps.workIdToStepIds[t.id_work].add(t.id_step);
        });
    }

    function populateDropdowns(fOrder = '', fPo = '', fWork = '', fStep = '') {
        const isMatch = (item, orderVal, poVal, workVal, stepVal) => {
            let wCode = maps.workIdToCode[item.id_work] ? String(maps.workIdToCode[item.id_work]).trim() : String(item.id_work);
            let matchOrder = !orderVal || (item.order_no && String(item.order_no).trim() === orderVal);
            let matchPo = !poVal || (item.po_no && String(item.po_no).trim() === poVal);
            let matchWork = !workVal || wCode === workVal;
            let matchStep = true;
            if(stepVal) {
                let sIds = maps.workIdToStepIds[item.id_work];
                matchStep = sIds && sIds.has(parseInt(stepVal));
            }
            return matchOrder && matchPo && matchWork && matchStep;
        };

        const validForOrder = rawData.orders.filter(i => isMatch(i, '', fPo, fWork, fStep));
        const validForPo = rawData.orders.filter(i => isMatch(i, fOrder, '', fWork, fStep));
        const validForWork = rawData.orders.filter(i => isMatch(i, fOrder, fPo, '', fStep));
        const validForStep = rawData.orders.filter(i => isMatch(i, fOrder, fPo, fWork, ''));

        const orders = [...new Set(validForOrder.map(i => i.order_no ? String(i.order_no).trim() : null).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'th', {numeric:true}));
        const pos = [...new Set(validForPo.map(i => i.po_no ? String(i.po_no).trim() : null).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'th', {numeric:true}));
        const works = [...new Set(validForWork.map(i => (maps.workIdToCode[i.id_work] || i.id_work) ? String(maps.workIdToCode[i.id_work] || i.id_work).trim() : null).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'th', {numeric:true}));

        let validStepIds = new Set();
        validForStep.forEach(o => { if(maps.workIdToStepIds[o.id_work]) maps.workIdToStepIds[o.id_work].forEach(id => validStepIds.add(id)); });
        const steps = [...validStepIds].map(id => ({ id: id, name: getStepAbbr(maps.stepIdToName[id]) })).filter(s => s.name).sort((a,b) => a.name.localeCompare(b.name, 'th'));

        const upd = (id, arr, def, val) => {
            let el = document.getElementById(id);
            el.innerHTML = `<option value="">${def}</option>` + arr.map(x => {
                let v = typeof x === 'object' ? x.id : x;
                let n = typeof x === 'object' ? x.name : x;
                return `<option value="${v}" ${String(v)===val?'selected':''}>${n}</option>`;
            }).join('');
        };

        upd('filter_order', orders, '-- All Orders --', fOrder);
        upd('filter_po', pos, '-- All PO --', fPo);
        upd('filter_work', works, '-- All Products --', fWork);
        upd('filter_step', steps, '-- All Steps --', fStep);
    }

    function applyFilters() {
        const fOrder = document.getElementById('filter_order').value;
        const fPo = document.getElementById('filter_po').value;
        const fWork = document.getElementById('filter_work').value;
        const fStep = document.getElementById('filter_step').value;

        populateDropdowns(fOrder, fPo, fWork, fStep);
        document.getElementById('ganttChartTitle').innerText = fWork ? `> แผนงานชิ้นงาน: ${fWork}` : (fOrder ? `> แผนงานใบสั่ง: ${fOrder}` : '> ภาพรวมแผนงานทั้งหมด');

        let filteredOrders = rawData.orders.filter(o => {
            let wCode = maps.workIdToCode[o.id_work] ? String(maps.workIdToCode[o.id_work]).trim() : String(o.id_work);
            let matchOrder = !fOrder || (o.order_no && String(o.order_no).trim() === fOrder);
            let matchPo = !fPo || (o.po_no && String(o.po_no).trim() === fPo);
            let matchWork = !fWork || wCode === fWork;
            let matchStep = !fStep || (maps.workIdToStepIds[o.id_work] && maps.workIdToStepIds[o.id_work].has(parseInt(fStep)));
            return matchOrder && matchPo && matchWork && matchStep;
        });

        renderGanttChart(filteredOrders, fStep);
    }

    function clearFilters() {
        ['filter_order','filter_po','filter_work','filter_step'].forEach(id => document.getElementById(id).value = '');
        applyFilters();
    }

    function renderGanttChart(orders, filteredStepId) {
        const thead = document.getElementById('ganttHead');
        const tbody = document.getElementById('ganttBody');

        if(orders.length === 0) {
            thead.innerHTML = `<tr>
                <th style="min-width:170px;">ขั้นตอน [Order]</th>
                <th style="min-width:130px;">รหัสชิ้นงาน</th>
                <th style="min-width:220px;">ผลิตได้ / ยอดสั่ง / %</th>
            </tr>`;
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">ไม่พบข้อมูลตามเงื่อนไข</td></tr>`;
            return;
        }

        let rowsData = [];
        let minDate = new Date("2099-12-31");
        let maxDate = new Date("2000-01-01");

        orders.forEach(order => {
            let orderQty = order.quantity || 0;
            let stepIds = maps.workIdToStepIds[order.id_work]; 
            
            if (stepIds) {
                stepIds.forEach(stepId => {
                    if (filteredStepId && String(stepId) !== filteredStepId) return;
                    
                    let taskId = `${order.id_order}_${stepId}`; // Unique ID สำหรับลาก
                    let oStep = rawData.orderSteps.find(os => os.id_order === order.id_order && os.id_step === stepId);
                    
                    // ดึงข้อมูลวันที่ (ถ้ามีการแก้ไขในระบบจำลอง (localEdits) ให้ใช้อันนั้นก่อน)
                    let startDateStr = (localEdits[taskId] && localEdits[taskId].startDate) ? localEdits[taskId].startDate : ((oStep && oStep.start_date) ? oStep.start_date : order.start_date);
                    let endDateStr = (localEdits[taskId] && localEdits[taskId].endDate) ? localEdits[taskId].endDate : ((oStep && oStep.end_date) ? oStep.end_date : order.end_date);

                    if(!startDateStr || !endDateStr) return;

                    let sDate = new Date(startDateStr);
                    let eDate = new Date(endDateStr);
                    if (sDate < minDate) minDate = new Date(sDate);
                    if (eDate > maxDate) maxDate = new Date(eDate);

                    let actualTotal = 0;
                    rawData.daily.forEach(dp => {
                        if (dp.id_order === order.id_order && maps.targetIdToStepId[dp.id_target] === stepId) {
                            actualTotal += dp.produced_amount || 0;
                        }
                    });

                    let wCode = maps.workIdToCode[order.id_work] ? String(maps.workIdToCode[order.id_work]).trim() : (order.id_work || '-');

                    rowsData.push({
                        taskId: taskId,
                        order_id: order.id_order,
                        step_id: stepId,
                        order_no: order.order_no || 'N/A',
                        work_code: wCode,
                        step_name: getStepAbbr(maps.stepIdToName[stepId]) || 'Unknown',
                        target: orderQty,
                        actual: actualTotal,
                        startDate: sDate,
                        endDate: eDate
                    });
                });
            }
        });

        if (rowsData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">ไม่มีข้อมูลวันที่สำหรับแผนงานนี้</td></tr>`;
            return;
        }

        // จัดกลุ่มและเรียงลำดับข้อมูล
        // 1. จัดกลุ่มตามเลขที่ใบสั่ง (Order No)
        let groupedOrders = {};
        rowsData.forEach(row => {
            if (!groupedOrders[row.order_no]) {
                groupedOrders[row.order_no] = {
                    order_no: row.order_no,
                    earliestStart: new Date("2099-12-31"), // เซ็ตวันที่ไกลๆ ไว้เพื่อเปรียบเทียบ
                    tasks: []
                };
            }
            groupedOrders[row.order_no].tasks.push(row);
            
            // หาว่าในใบสั่งนี้ งานไหนเริ่มเร็วที่สุด เพื่อใช้เป็นเกณฑ์จัดลำดับของกลุ่ม
            if (row.startDate < groupedOrders[row.order_no].earliestStart) {
                groupedOrders[row.order_no].earliestStart = row.startDate;
            }
        });

        // 2. เรียงลำดับกลุ่มใบสั่ง ตามวันที่เริ่มงานที่เร็วที่สุด (น้อยไปมาก - บนลงล่าง)
        let sortedGroups = Object.values(groupedOrders).sort((a, b) => a.earliestStart - b.earliestStart);

        // 3. เรียงลำดับงานย่อยภายในใบสั่งเดียวกัน และรวมกลับเป็น Array เดียว
        rowsData = [];
        sortedGroups.forEach(group => {
            // เรียงลำดับขั้นตอนภายในใบสั่ง ตามวันที่เริ่มผลิต
            group.tasks.sort((a, b) => a.startDate - b.startDate);
            rowsData.push(...group.tasks);
        });

        minDate.setDate(minDate.getDate() - 1);
        maxDate.setDate(maxDate.getDate() + 1);
        
        currentMinDate = new Date(minDate); // เก็บไว้คำนวณตอนลาก

        let dateHeaders = [];
        let curr = new Date(minDate);
        while (curr <= maxDate) {
            dateHeaders.push(new Date(curr));
            curr.setDate(curr.getDate() + 1);
        }
        currentTotalDays = dateHeaders.length;

        // Thead (เพิ่มขนาด Column วันที่ให้ตายตัว)
        let headHtml = `<tr>
            <th style="min-width: 170px;">ขั้นตอน <span style="font-weight:normal; font-size:0.65rem;">[Order]</span></th>
            <th style="min-width: 130px;">รหัสชิ้นงาน</th>
            <th style="min-width: 220px;">ผลิตได้ / ยอดสั่ง / %</th>`;
        dateHeaders.forEach(d => { 
            headHtml += `<th class="date-header">${d.getDate()}/${d.getMonth()+1}</th>`; 
        });
        headHtml += `</tr>`;
        thead.innerHTML = headHtml;

        // Tbody (เปลี่ยนการ Render Timeline Area เป็น Absolute Layout)
        let bodyHtml = '';
        rowsData.forEach(row => {
            const offsetDays = Math.ceil(Math.abs(row.startDate - minDate) / 86400000);
            const durationDays = Math.ceil(Math.abs(row.endDate - row.startDate) / 86400000) + 1; 

            let realPercent = (row.target > 0) ? (row.actual / row.target) * 100 : 0;
            let percentWidth = Math.min(realPercent, 100); 
            let textClass = percentWidth < 20 ? "low-percent" : "";

            let isEditing = editingTaskId === row.taskId;

            bodyHtml += `<tr>`;
            
            // Col 1, 2, 3 (Sticky Data)
            bodyHtml += `
                <td style="padding: 0 8px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; height: 100%;">
                        <span class="step-name">${row.step_name}</span> 
                        <span class="step-order">[${row.order_no}]</span>
                    </div>
                </td>
                <td style="padding: 0 8px;">
                    <span class="work-code-text">${row.work_code}</span>
                </td>
                <td style="padding: 0; font-family: 'Courier New', monospace; font-size: 0.8rem; letter-spacing: -0.5px;">
                    <div style="display: grid; grid-template-columns: 60px 15px 60px 15px 50px; justify-content: center; align-items: center; width: 100%; height: 100%;">
                        <span style="color: var(--neon-green); font-weight: bold; text-align: right;">${row.actual.toLocaleString()}</span>
                        <span style="color: var(--text-muted); text-align: center;">/</span>
                        <span style="color: #ffffff; text-align: right;">${row.target.toLocaleString()}</span>
                        <span style="color: var(--text-muted); text-align: center;">/</span>
                        <span style="color: var(--neon-yellow); text-align: right;">${realPercent.toFixed(1)}%</span>
                    </div>
                </td>
            `;

            // Timeline Area (Absolute Container Overlay)
            let totalGridWidth = currentTotalDays * CELL_WIDTH;
            bodyHtml += `
                <td colspan="${currentTotalDays}" style="padding: 0; min-width: ${totalGridWidth}px; max-width: ${totalGridWidth}px; position: relative;">
                    <!-- พื้นหลังตารางตารางแนวตั้งแบบเนียน ๆ -->
                    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
                                background: repeating-linear-gradient(to right, transparent, transparent ${CELL_WIDTH - 1}px, rgba(39,63,52,0.4) ${CELL_WIDTH - 1}px, rgba(39,63,52,0.4) ${CELL_WIDTH}px);">
                    </div>
                    
                    <!-- Gantt Bar -->
                    <div class="gantt-bar-wrapper ${isEditing ? 'is-editing' : ''}" 
                         data-taskid="${row.taskId}"
                         ondblclick="startEditing('${row.taskId}')"
                         style="left: ${offsetDays * CELL_WIDTH}px; width: ${durationDays * CELL_WIDTH}px;">
                        
                        <div class="bar-planned"></div>
                        <div class="bar-actual" style="width: ${percentWidth}%;"></div>
                        <div class="bar-text ${textClass}">${percentWidth.toFixed(0)}%</div>
                        
                        ${isEditing ? `
                            <div class="resize-handle resize-handle-left" data-action="resize-left"></div>
                            <div class="resize-handle resize-handle-right" data-action="resize-right"></div>
                        ` : ''}
                    </div>
                </td>
            `;
            
            bodyHtml += `</tr>`;
        });

        tbody.innerHTML = bodyHtml;
    }

    // --- Interactive Drag and Drop Logic ---

    function startEditing(taskId) {
        editingTaskId = taskId;
        applyFilters(); // Re-render to show edit handles
        document.getElementById('save-bar').classList.add('show');
    }

    function cancelEdits() {
        editingTaskId = null;
        localEdits = {}; // ล้างค่าที่จำไว้
        applyFilters();
        document.getElementById('save-bar').classList.remove('show');
    }

    async function saveEdits() {
        if (Object.keys(localEdits).length === 0) {
            cancelEdits();
            return;
        }

        const btnSave = document.getElementById('btn-save-edits');
        const originalText = btnSave.innerHTML;
        btnSave.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-1"></i> กำลังบันทึก...`;
        btnSave.disabled = true;

        try {
            // วนลูปส่ง Request ไปอัปเดตข้อมูลทีละรายการที่ถูกแก้ไข
            const updatePromises = Object.entries(localEdits).map(async ([taskId, dates]) => {
                // taskId มีรูปแบบ "idOrder_idStep" เช่น "1_5"
                const [orderIdStr, stepIdStr] = taskId.split('_');
                const orderId = parseInt(orderIdStr);
                const stepId = parseInt(stepIdStr);

                // ยิง API แบบ PATCH เพื่ออัปเดตข้อมูล
                const url = `${SUPABASE_URL}/order_steps?id_order=eq.${orderId}&id_step=eq.${stepId}`;
                const payload = {
                    start_date: dates.startDate,
                    end_date: dates.endDate
                };

                const response = await fetch(url, {
                    method: 'PATCH',
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Failed to update Task ID: ${taskId}`);
                }
            });

            await Promise.all(updatePromises);
            
            // เมื่อสำเร็จ
            alert('บันทึกข้อมูลวันที่สำเร็จแล้ว');
            
            editingTaskId = null;
            localEdits = {}; // เคลียร์ของเก่าทิ้ง
            document.getElementById('save-bar').classList.remove('show');
            
            // เรียกดึงข้อมูลใหม่จากฐานข้อมูลเพื่อวาดตารางใหม่
            await fetchAllData(); 
            
        } catch (error) {
            console.error("Error saving edits:", error);
            alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง');
        } finally {
            btnSave.innerHTML = originalText;
            btnSave.disabled = false;
        }
    }

    function setupDragAndDrop() {
        const container = document.getElementById('ganttBody');
        let isDragging = false;
        let currentAction = null; // 'move', 'resize-left', 'resize-right'
        let activeElement = null;
        let startMouseX = 0;
        let initialLeft = 0;
        let initialWidth = 0;
        let activeTaskId = null;

        container.addEventListener('mousedown', (e) => {
            if (!editingTaskId) return; 
            
            const wrapper = e.target.closest('.is-editing');
            if (!wrapper) return;

            activeElement = wrapper;
            activeTaskId = wrapper.dataset.taskid;
            isDragging = true;
            startMouseX = e.clientX;
            
            initialLeft = parseInt(wrapper.style.left) || 0;
            initialWidth = parseInt(wrapper.style.width) || 0;

            if (e.target.classList.contains('resize-handle-left')) {
                currentAction = 'resize-left';
            } else if (e.target.classList.contains('resize-handle-right')) {
                currentAction = 'resize-right';
            } else {
                currentAction = 'move';
            }
            
            document.body.style.userSelect = 'none'; // Prevent text highlighting
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging || !activeElement) return;

            const dx = e.clientX - startMouseX;
            const maxAllowedWidth = currentTotalDays * CELL_WIDTH;
            
            if (currentAction === 'move') {
                let newLeft = initialLeft + dx;
                newLeft = Math.max(0, Math.min(newLeft, maxAllowedWidth - initialWidth));
                activeElement.style.left = `${newLeft}px`;
            } 
            else if (currentAction === 'resize-left') {
                let newLeft = initialLeft + dx;
                let newWidth = initialWidth - dx;
                
                if (newWidth >= CELL_WIDTH && newLeft >= 0) {
                    activeElement.style.left = `${newLeft}px`;
                    activeElement.style.width = `${newWidth}px`;
                }
            } 
            else if (currentAction === 'resize-right') {
                let newWidth = initialWidth + dx;
                if (newWidth >= CELL_WIDTH && (initialLeft + newWidth) <= maxAllowedWidth) {
                    activeElement.style.width = `${newWidth}px`;
                }
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            document.body.style.userSelect = '';

            // Snap เข้า Grid ช่องละ 20px
            const currentLeft = parseInt(activeElement.style.left);
            const currentWidth = parseInt(activeElement.style.width);
            
            const snappedOffset = Math.round(currentLeft / CELL_WIDTH);
            const snappedDuration = Math.max(1, Math.round(currentWidth / CELL_WIDTH));
            
            activeElement.style.left = `${snappedOffset * CELL_WIDTH}px`;
            activeElement.style.width = `${snappedDuration * CELL_WIDTH}px`;

            // คำนวณวันที่ใหม่
            if (activeTaskId && currentMinDate) {
                let newStartDate = new Date(currentMinDate);
                newStartDate.setDate(currentMinDate.getDate() + snappedOffset);
                
                let newEndDate = new Date(newStartDate);
                newEndDate.setDate(newStartDate.getDate() + snappedDuration - 1);
                
                // เก็บลง Local Edits (format เป็น YYYY-MM-DD เพื่อเอาไว้ส่ง API)
                localEdits[activeTaskId] = {
                    startDate: newStartDate.toISOString().split('T')[0],
                    endDate: newEndDate.toISOString().split('T')[0]
                };
            }

            activeElement = null;
            currentAction = null;
        });
    }

</script>
