<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAGUAR GANTT CHART // STOCK BOARD THEME</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030806;
            --panel-bg: rgba(7, 24, 16, 0.95);
            --border-neon: #00ff88;
            --border-dim: #17633c;
            --text-main: #f0fdf7;
            --text-label: #a7e0c4;
            --text-muted: #8ca89a;
            --neon-green: #00ff88;
            --neon-glow: rgba(0, 255, 136, 0.3);
            --neon-yellow: #f5a623;
            --input-bg: #112a1e;
            --input-text: #ffffff;
            --table-bg: #071910;
            --bar-planned: #113a24;
            --bar-actual: #00ff88;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(3, 8, 6, 0.95), rgba(5, 20, 12, 0.9)),
                        url('https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=1200&q=80') no-repeat center center;
            background-size: cover;
            z-index: -1;
            filter: brightness(0.3) contrast(1.2) hue-rotate(60deg);
        }

        .dashboard-container {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 25px var(--neon-glow);
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        /* Filter Section */
        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--border-dim);
            padding-bottom: 10px;
        }

        .filter-title {
            font-weight: bold;
            color: var(--neon-green);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sync-status {
            font-size: 0.75rem;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 136, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--neon-green);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .filter-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-label);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-select-stock {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-dim);
            color: var(--input-text);
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: 'Courier New', Courier, monospace;
            outline: none;
            transition: all 0.2s;
        }

        .form-select-stock:focus {
            background-color: var(--bg-dark);
            border-color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .btn-reset {
            background: #212529;
            color: #ced4da;
            border: 1px solid #495057;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reset:hover { background: #343a40; color: #fff; border-color: #ced4da; }

        /* Gantt Chart Area */
        .gantt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .gantt-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--neon-yellow);
            text-transform: uppercase;
        }

        .gantt-legend {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border: 1px solid var(--border-dim);
            padding: 6px 12px;
            border-radius: 6px;
            background: var(--table-bg);
        }

        .legend-item { display: flex; align-items: center; gap: 6px; }
        .box-planned { width: 12px; height: 12px; background: var(--bar-planned); border: 1px solid var(--border-dim); }
        .box-actual { width: 12px; height: 12px; background: var(--bar-actual); box-shadow: 0 0 5px var(--neon-green); }

        .gantt-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            background: var(--table-bg);
            max-height: 65vh;
            position: relative;
        }

        .gantt-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        .gantt-table th, .gantt-table td {
            border: 1px solid var(--border-dim);
            padding: 10px;
            text-align: center;
            color: var(--text-main);
        }

        .gantt-table th {
            background-color: #05140c;
            color: var(--neon-green);
            font-size: 0.85rem;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
            text-transform: uppercase;
        }

        /* ----- การตั้งค่า Sticky คอลัมน์ที่ 1 และ 2 ----- */
        /* คอลัมน์ที่ 1 (ชื่อขั้นตอน) */
        .gantt-table th:nth-child(1), .gantt-table td:nth-child(1) {
            position: sticky;
            left: 0;
            background-color: var(--table-bg);
            z-index: 11;
            text-align: left;
            min-width: 140px;
            max-width: 140px;
            border-right: 1px solid var(--border-dim);
        }

        /* คอลัมน์ที่ 2 (สถานะยอดผลิต) */
        .gantt-table th:nth-child(2), .gantt-table td:nth-child(2) {
            position: sticky;
            left: 140px; /* ต้องเท่ากับความกว้างของคอลัมน์แรก */
            background-color: var(--table-bg);
            z-index: 11;
            text-align: center;
            min-width: 220px;
            max-width: 220px;
            border-right: 2px solid var(--neon-green);
        }

        /* ให้หัวตารางของ 2 คอลัมน์แรกอยู่บนสุด (z-index สูงสุด) */
        .gantt-table thead th:nth-child(1), .gantt-table thead th:nth-child(2) {
            z-index: 12;
            background-color: #05140c;
        }

        /* เอฟเฟกต์ Hover ของตาราง */
        tr:hover td { background-color: rgba(0, 255, 136, 0.05); }
        tr:hover td:nth-child(1), tr:hover td:nth-child(2) { background-color: #0b2e1c; }

        .step-name { font-weight: bold; color: var(--text-main); font-size: 0.95rem; margin-bottom: 4px;}
        .step-order { font-size: 0.75rem; color: var(--neon-yellow); font-weight: bold; }

        /* แถบกราฟ Gantt */
        .gantt-bar-wrapper {
            position: relative;
            height: 30px;
            width: 100%;
            background-color: transparent;
            display: flex;
            align-items: center;
        }

        .bar-planned {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 100%;
            background-color: var(--bar-planned);
            border: 1px dashed var(--border-dim);
            border-radius: 4px;
            z-index: 1;
        }

        .bar-actual {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background-color: var(--bar-actual);
            border-radius: 4px;
            z-index: 2;
            transition: width 0.5s ease-in-out;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            z-index: 3;
            color: #000;
            font-size: 0.8rem;
            font-weight: bold;
            line-height: 30px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 5px;
        }
        
        .bar-text.low-percent {
            color: var(--neon-green);
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>

    <!-- ตัวกรองข้อมูล -->
    <div class="dashboard-container">
        <div class="filter-header">
            <div class="filter-title">
                <i class="fa-solid fa-chart-gantt"></i> JAGUAR GANTT CHART // STOCK BOARD
            </div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div class="sync-status" id="syncIndicator">
                    <i class="fa-solid fa-circle-check"></i> LIVE SYNC
                </div>
                <button class="btn-reset" onclick="clearFilters()"><i class="fa-solid fa-rotate-right"></i> RESET</button>
            </div>
        </div>
        <div class="filter-grid">
            <div class="filter-group">
                <label>Order No:</label>
                <select id="filter_order" class="form-select-stock" onchange="applyFilters()">
                    <option value="">-- ทุกใบสั่ง --</option>
                </select>
            </div>
            <div class="filter-group">
                <label>PO No:</label>
                <select id="filter_po" class="form-select-stock" onchange="applyFilters()">
                    <option value="">-- ทุก PO --</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Product Code:</label>
                <select id="filter_work" class="form-select-stock" onchange="applyFilters()">
                    <option value="">-- ทุกรหัสสินค้า --</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Step:</label>
                <select id="filter_step" class="form-select-stock" onchange="applyFilters()">
                    <option value="">-- ทุกขั้นตอน --</option>
                </select>
            </div>
        </div>
    </div>

    <!-- พื้นที่แสดง Gantt Chart -->
    <div class="dashboard-container">
        <div class="gantt-header">
            <div class="gantt-title" id="ganttChartTitle">> ภาพรวมแผนงาน</div>
            <div class="gantt-legend">
                <div class="legend-item"><div class="box-planned"></div> ระยะเวลาตามแผน</div>
                <div class="legend-item"><div class="box-actual"></div> ผลิตได้จริงทับซ้อน</div>
            </div>
        </div>
        
        <div class="gantt-container">
            <table class="gantt-table" id="ganttTable">
                <thead id="ganttHead">
                    <tr>
                        <th style="min-width: 140px;">ขั้นตอน / Order</th>
                        <th style="min-width: 220px;">สถานะยอดผลิต</th>
                        <th>กำลังโหลดข้อมูล...</th>
                    </tr>
                </thead>
                <tbody id="ganttBody">
                    <tr>
                        <td colspan="3" class="text-center py-4 text-muted">
                            <i class="fa-solid fa-spinner fa-spin me-2"></i> กำลังซิงก์ข้อมูลฐานข้อมูล...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
    const headers = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };

    const STEP_ABBR_MAP = {
        "ตัดเหรียญมือ": "ตร.มือ",
        "ตัดเหรียญออโต": "ตร.ออโต",
        "ตัดมุม": "ตัดมุม",
        "รีดใบ": "รีดใบ",
        "ตัดใบ": "ตัดใบ",
        "ตร.มือ": "ตร.มือ",
        "ตร.ออโต": "ตร.ออโต"
    };

    function getStepAbbr(name) {
        if(!name) return "";
        return STEP_ABBR_MAP[name.trim()] || name.trim();
    }

    let rawData = { orders: [], workItems: [], steps: [], targets: [], daily: [], orderSteps: [] };
    
    let maps = {
        workIdToCode: {},
        stepIdToName: {},
        targetIdToStepId: {},
        workIdToStepIds: {} 
    };

    window.onload = async function() {
        await fetchAllData();
        setInterval(fetchAllData, 30000);
    };

    async function fetchAllData() {
        try {
            document.getElementById('syncIndicator').innerHTML = '<i class="fa-solid fa-arrows-rotate fa-spin"></i> SYNCING...';
            document.getElementById('syncIndicator').style.borderColor = "var(--neon-yellow)";
            document.getElementById('syncIndicator').style.color = "var(--neon-yellow)";

            const endpoints = [
                `${SUPABASE_URL}/orders?select=*`,
                `${SUPABASE_URL}/work_items?select=*`,
                `${SUPABASE_URL}/production_steps?select=*`,
                `${SUPABASE_URL}/targets?select=*`,
                `${SUPABASE_URL}/daily_production?select=id_order,id_target,produced_amount`,
                `${SUPABASE_URL}/order_steps?select=*`
            ];

            const responses = await Promise.all(endpoints.map(url => fetch(url, { headers })));
            const data = await Promise.all(responses.map(res => res.json()));

            rawData = {
                orders: data[0], workItems: data[1], steps: data[2], 
                targets: data[3], daily: data[4], orderSteps: data[5] || [] 
            };

            buildMaps();
            applyFilters();

            setTimeout(() => {
                document.getElementById('syncIndicator').innerHTML = '<i class="fa-solid fa-circle-check"></i> LIVE SYNC';
                document.getElementById('syncIndicator').style.borderColor = "var(--neon-green)";
                document.getElementById('syncIndicator').style.color = "var(--neon-green)";
            }, 1000);

        } catch (error) {
            console.error("Fetch Data Error:", error);
            document.getElementById('syncIndicator').innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ERROR';
            document.getElementById('syncIndicator').style.color = "#ff3366";
            document.getElementById('syncIndicator').style.borderColor = "#ff3366";
        }
    }

    function buildMaps() {
        maps.workIdToCode = {};
        rawData.workItems.forEach(w => maps.workIdToCode[w.id_work] = w.work_code);

        maps.stepIdToName = {};
        rawData.steps.forEach(s => maps.stepIdToName[s.id_step] = s.step_name);

        maps.targetIdToStepId = {};
        maps.workIdToStepIds = {};
        rawData.targets.forEach(t => {
            maps.targetIdToStepId[t.id_target] = t.id_step;
            if(!maps.workIdToStepIds[t.id_work]) maps.workIdToStepIds[t.id_work] = new Set();
            maps.workIdToStepIds[t.id_work].add(t.id_step);
        });
    }

    function populateDropdowns(fOrder = '', fPo = '', fWork = '', fStep = '') {
        const selOrder = document.getElementById('filter_order');
        const selPo = document.getElementById('filter_po');
        const selWork = document.getElementById('filter_work');
        const selStep = document.getElementById('filter_step');

        const isMatch = (item, orderVal, poVal, workVal, stepVal) => {
            let wCode = maps.workIdToCode[item.id_work] ? String(maps.workIdToCode[item.id_work]).trim() : String(item.id_work);
            let matchOrder = !orderVal || (item.order_no && item.order_no.trim() === orderVal);
            let matchPo = !poVal || (item.po_no && item.po_no.trim() === poVal);
            let matchWork = !workVal || wCode === workVal;
            let matchStep = true;
            if(stepVal) {
                let sIds = maps.workIdToStepIds[item.id_work];
                matchStep = sIds && sIds.has(parseInt(stepVal));
            }
            return matchOrder && matchPo && matchWork && matchStep;
        };

        const validForOrder = rawData.orders.filter(item => isMatch(item, '', fPo, fWork, fStep));
        const validForPo = rawData.orders.filter(item => isMatch(item, fOrder, '', fWork, fStep));
        const validForWork = rawData.orders.filter(item => isMatch(item, fOrder, fPo, '', fStep));
        const validForStep = rawData.orders.filter(item => isMatch(item, fOrder, fPo, fWork, ''));

        const orders = [...new Set(validForOrder.map(i => i.order_no ? String(i.order_no).trim() : null).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'th', {numeric:true}));
        const pos = [...new Set(validForPo.map(i => i.po_no ? String(i.po_no).trim() : null).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'th', {numeric:true}));
        const works = [...new Set(validForWork.map(i => {
            let code = maps.workIdToCode[i.id_work] || i.id_work;
            return code ? String(code).trim() : null;
        }).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'th', {numeric:true}));

        let validStepIds = new Set();
        validForStep.forEach(o => {
            let sIds = maps.workIdToStepIds[o.id_work];
            if(sIds) sIds.forEach(id => validStepIds.add(id));
        });
        const steps = [...validStepIds].map(id => ({ id: id, name: getStepAbbr(maps.stepIdToName[id]) })).filter(s => s.name).sort((a,b) => a.name.localeCompare(b.name, 'th'));

        selOrder.innerHTML = '<option value="">-- ทุกใบสั่ง --</option>';
        orders.forEach(o => selOrder.innerHTML += `<option value="${o}" ${o===fOrder?'selected':''}>${o}</option>`);

        selPo.innerHTML = '<option value="">-- ทุก PO --</option>';
        pos.forEach(p => selPo.innerHTML += `<option value="${p}" ${p===fPo?'selected':''}>${p}</option>`);

        selWork.innerHTML = '<option value="">-- ทุกรหัสสินค้า --</option>';
        works.forEach(w => selWork.innerHTML += `<option value="${w}" ${w===fWork?'selected':''}>${w}</option>`);

        selStep.innerHTML = '<option value="">-- ทุกขั้นตอน --</option>';
        steps.forEach(s => selStep.innerHTML += `<option value="${s.id}" ${String(s.id)===fStep?'selected':''}>${s.name}</option>`);
    }

    function applyFilters() {
        const fOrder = document.getElementById('filter_order').value;
        const fPo = document.getElementById('filter_po').value;
        const fWork = document.getElementById('filter_work').value;
        const fStep = document.getElementById('filter_step').value;

        populateDropdowns(fOrder, fPo, fWork, fStep);

        document.getElementById('ganttChartTitle').innerText = fWork ? `> แผนงานชิ้นงาน: ${fWork}` : (fOrder ? `> แผนงานใบสั่ง: ${fOrder}` : '> ภาพรวมแผนงาน');

        let filteredOrders = rawData.orders.filter(o => {
            let wCode = maps.workIdToCode[o.id_work] ? String(maps.workIdToCode[o.id_work]).trim() : String(o.id_work);
            let matchOrder = !fOrder || (o.order_no && o.order_no.trim() === fOrder);
            let matchPo = !fPo || (o.po_no && o.po_no.trim() === fPo);
            let matchWork = !fWork || wCode === fWork;
            
            let matchStep = true;
            if(fStep) {
                let sIds = maps.workIdToStepIds[o.id_work];
                matchStep = sIds && sIds.has(parseInt(fStep));
            }

            return matchOrder && matchPo && matchWork && matchStep;
        });

        renderGanttChart(filteredOrders, fStep);
    }

    function clearFilters() {
        document.getElementById('filter_order').value = '';
        document.getElementById('filter_po').value = '';
        document.getElementById('filter_work').value = '';
        document.getElementById('filter_step').value = '';
        applyFilters();
    }

    function renderGanttChart(orders, filteredStepId) {
        const thead = document.getElementById('ganttHead');
        const tbody = document.getElementById('ganttBody');

        if(orders.length === 0) {
            thead.innerHTML = `<tr><th>ขั้นตอน / Order</th><th>สถานะยอดผลิต</th></tr>`;
            tbody.innerHTML = `<tr><td colspan="2" class="text-center py-4 text-muted">ไม่พบข้อมูลตามเงื่อนไขที่กรอง</td></tr>`;
            return;
        }

        let rowsData = [];
        let minDate = new Date("2099-12-31");
        let maxDate = new Date("2000-01-01");

        orders.forEach(order => {
            let orderQty = order.quantity || 0;
            let stepIds = maps.workIdToStepIds[order.id_work]; 
            
            if (stepIds) {
                stepIds.forEach(stepId => {
                    if (filteredStepId && String(stepId) !== filteredStepId) return;

                    let oStep = rawData.orderSteps.find(os => os.id_order === order.id_order && os.id_step === stepId);
                    let startDateStr = (oStep && oStep.start_date) ? oStep.start_date : order.start_date;
                    let endDateStr = (oStep && oStep.end_date) ? oStep.end_date : order.end_date;

                    if(!startDateStr || !endDateStr) return;

                    let sDate = new Date(startDateStr);
                    let eDate = new Date(endDateStr);

                    if (sDate < minDate) minDate = new Date(sDate);
                    if (eDate > maxDate) maxDate = new Date(eDate);

                    let actualTotal = 0;
                    rawData.daily.forEach(dp => {
                        if (dp.id_order === order.id_order && maps.targetIdToStepId[dp.id_target] === stepId) {
                            actualTotal += dp.produced_amount || 0;
                        }
                    });

                    rowsData.push({
                        order_no: order.order_no || 'N/A',
                        step_name: getStepAbbr(maps.stepIdToName[stepId]) || 'Unknown',
                        target: orderQty,
                        actual: actualTotal,
                        startDate: sDate,
                        endDate: eDate
                    });
                });
            }
        });

        if (rowsData.length === 0) {
            thead.innerHTML = `<tr><th>ขั้นตอน / Order</th><th>สถานะยอดผลิต</th></tr>`;
            tbody.innerHTML = `<tr><td colspan="2" class="text-center py-4 text-muted">ไม่มีข้อมูลวันที่สำหรับแผนงานนี้</td></tr>`;
            return;
        }

        minDate.setDate(minDate.getDate() - 1);
        maxDate.setDate(maxDate.getDate() + 1);
        
        let dateHeaders = [];
        let curr = new Date(minDate);
        while (curr <= maxDate) {
            dateHeaders.push(new Date(curr));
            curr.setDate(curr.getDate() + 1);
        }
        let totalDays = dateHeaders.length;

        // วาดหัวตาราง (Thead)
        let headHtml = `<tr>
            <th style="min-width: 140px;">ขั้นตอน / Order</th>
            <th style="min-width: 220px;">สถานะยอดผลิต</th>`;
            
        dateHeaders.forEach(d => {
            let dStr = `${d.getDate()}/${d.getMonth()+1}`;
            headHtml += `<th style="min-width: 60px;">${dStr}</th>`;
        });
        headHtml += `</tr>`;
        thead.innerHTML = headHtml;

        // วาดเนื้อหาตาราง (Tbody)
        let bodyHtml = '';
        rowsData.forEach(row => {
            const diffTimeStart = Math.abs(row.startDate - minDate);
            const offsetDays = Math.ceil(diffTimeStart / (1000 * 60 * 60 * 24));
            
            const diffTimeDuration = Math.abs(row.endDate - row.startDate);
            const durationDays = Math.ceil(diffTimeDuration / (1000 * 60 * 60 * 24)) + 1; 
            
            const remainingDays = totalDays - offsetDays - durationDays; 

            let percent = 0;
            if (row.target > 0) {
                percent = (row.actual / row.target) * 100;
                if(percent > 100) percent = 100;
            }
            
            let textClass = percent < 40 ? "low-percent" : "";

            bodyHtml += `<tr>`;
            
            // คอลัมน์ 1: ข้อมูล Order / ขั้นตอน
            bodyHtml += `
                <td>
                    <div class="step-name">${row.step_name}</div>
                    <div class="step-order">${row.order_no}</div>
                </td>
            `;

            // คอลัมน์ 2: ข้อมูล "ทำได้: X / เป้า: Y" แบบชิดซ้ายตรึงไว้
            bodyHtml += `
                <td style="color: var(--neon-green); font-weight: bold; font-size: 0.85rem; vertical-align: middle;">
                    ทำได้: ${row.actual.toLocaleString()} / เป้า: ${row.target.toLocaleString()}
                </td>
            `;

            if (offsetDays > 0) bodyHtml += `<td colspan="${offsetDays}"></td>`;

            if (durationDays > 0) {
                // บาร์แสดงเป็นเปอร์เซ็นต์ %
                bodyHtml += `
                    <td colspan="${durationDays}" style="padding: 5px;">
                        <div class="gantt-bar-wrapper">
                            <div class="bar-planned"></div>
                            <div class="bar-actual" style="width: ${percent}%;"></div>
                            <div class="bar-text ${textClass}">${percent.toFixed(1)}%</div>
                        </div>
                    </td>
                `;
            }

            if (remainingDays > 0) bodyHtml += `<td colspan="${remainingDays}"></td>`;
            bodyHtml += `</tr>`;
        });

        tbody.innerHTML = bodyHtml;
    }
</script>

</body>
</html>
