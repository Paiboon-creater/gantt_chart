<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAGUAR GANTT CHART // CLEAN THEME</title>
    
    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- jQuery & Select2 สำหรับตัวกรองเลือกหลายรายการ -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        :root {
            --bg-dark: #f0f2f5;
            --panel-bg: #ffffff;
            --border-dim: #cbd5e1;
            --text-main: #1e293b;
            --text-label: #475569;
            --text-muted: #64748b;
            
            --primary-color: #2563eb;     /* น้ำเงิน */
            --success-color: #10b981;     /* เขียว */
            --warning-color: #f59e0b;     /* ส้ม/เหลือง */
            --danger-color: #ef4444;      /* แดง */
            
            --input-bg: #f8fafc;
            --input-text: #0f172a;
            --table-bg: #ffffff;
            
            --bar-planned: #e2e8f0;        
            --bar-actual: #2563eb;        
            --cell-width: 45px; 
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        .dashboard-container {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .filter-title {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sync-status {
            font-size: 0.8rem;
            color: var(--success-color);
            display: flex;
            align-items: center;
            gap: 6px;
            background: #dcfce7;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--success-color);
        }

        .filter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-group {
            flex: 1;
            min-width: 140px;
        }

        .filter-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-label);
            margin-bottom: 4px;
        }

        .form-select-stock {
            width: 100%;
            padding: 6px 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-dim);
            color: var(--input-text);
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-select-stock:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        /* ตกแต่ง Select2 ให้เข้ากับธีม */
        .select2-container--default .select2-selection--multiple {
            background-color: var(--input-bg);
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            min-height: 34px;
        }
        .select2-container--default.select2-container--focus .select2-selection--multiple {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }
        .select2-dropdown {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 0.85rem;
            border: 1px solid var(--primary-color);
        }
        .select2-container--default .select2-selection--multiple .select2-selection__choice {
            background-color: var(--primary-color);
            border: 1px solid var(--primary-color);
            color: #fff;
            border-radius: 3px;
            padding: 2px 6px;
        }
        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
            color: #fff;
            margin-right: 5px;
        }

        .btn-action {
            background: #ffffff;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-action:hover {
            background: #f8fafc;
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-primary-action {
            background: var(--primary-color);
            color: #ffffff;
            border: 1px solid var(--primary-color);
        }
        .btn-primary-action:hover {
            background: #1d4ed8;
            color: #ffffff;
        }

        .btn-print {
            background: #10b981;
            color: #ffffff;
            border: 1px solid #10b981;
        }
        .btn-print:hover {
            background: #059669;
            color: #ffffff;
        }

        .btn-login { background: #f0fdf4; color: var(--success-color); border-color: var(--success-color); }
        .btn-login:hover { background: var(--success-color); color: #fff; }
        .btn-logout { background: #fef2f2; color: var(--danger-color); border-color: var(--danger-color); }
        .btn-logout:hover { background: var(--danger-color); color: #fff; }

        .gantt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .gantt-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .gantt-legend {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--text-label);
            font-weight: 500;
        }

        .legend-item { display: flex; align-items: center; gap: 6px; }
        .box-planned { width: 12px; height: 12px; background: var(--bar-planned); border: 1px solid #94a3b8; border-radius: 2px;}
        .box-actual { width: 12px; height: 12px; background: var(--bar-actual); border-radius: 2px;}

        #ganttCardWrapper {
            position: relative;
            background: var(--panel-bg);
            transition: all 0.3s ease;
        }
        #ganttCardWrapper.fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 99999 !important;
            padding: 15px !important;
            margin: 0 !important;
            border-radius: 0 !important;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
        }
        #ganttCardWrapper.fullscreen .gantt-container {
            max-height: calc(100vh - 90px) !important;
            flex: 1;
        }

        .gantt-container {
            width: 100%;
            overflow: auto;
            border: 1px solid var(--border-dim);
            background: var(--table-bg);
            max-height: 70vh;
            position: relative;
            border-radius: 6px;
        }

        .gantt-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        .gantt-table th, .gantt-table td {
            border: 1px solid #e2e8f0;
            padding: 4px 8px;
            text-align: center;
            color: var(--text-main);
            font-size: 0.85rem;
            height: 45px; 
            white-space: nowrap;
            box-sizing: border-box;
        }

        .gantt-table th {
            position: sticky;
            top: -1px; 
            z-index: 20; 
            background-color: #f1f5f9;
            font-weight: 600;
        }

        .col-step { position: sticky; left: 0; background-color: #ffffff; z-index: 11; min-width: 250px; max-width: 250px; border-right: 2px solid var(--border-dim); }
        .col-code { position: sticky; left: 250px; background-color: #ffffff; z-index: 11; text-align: left; min-width: 170px; max-width: 170px; border-right: 2px solid var(--border-dim); }
        .col-progress { position: sticky; left: 420px; background-color: #ffffff; z-index: 11; text-align: center; min-width: 260px; max-width: 260px; border-right: 2px solid var(--border-dim); }
        .col-start { position: sticky; left: 680px; background-color: #ffffff; z-index: 11; text-align: center; min-width: 115px; max-width: 115px; border-right: 1px solid var(--border-dim); }
        .col-end { position: sticky; left: 795px; background-color: #ffffff; z-index: 11; text-align: center; min-width: 115px; max-width: 115px; border-right: 2px solid var(--border-dim); }

        .gantt-table thead .col-step, 
        .gantt-table thead .col-code, 
        .gantt-table thead .col-progress,
        .gantt-table thead .col-start,
        .gantt-table thead .col-end {
            z-index: 30; 
            background-color: #e2e8f0;
            color: #0f172a;
        }

        tr:hover td.col-step, 
        tr:hover td.col-code, 
        tr:hover td.col-progress,
        tr:hover td.col-start,
        tr:hover td.col-end { background-color: #f8fafc; }

        .table-hide-dates .col-start,
        .table-hide-dates .col-end { display: none !important; }
        .table-hide-dates .col-progress { border-right: 2px solid var(--border-dim) !important; }

        .date-header {
            min-width: var(--cell-width) !important;
            max-width: var(--cell-width) !important;
            width: var(--cell-width) !important;
            padding: 6px 0 !important;
            background-color: #f1f5f9;
            color: #475569;
            font-size: 0.8rem;
            position: sticky;
            top: -1px;
            z-index: 20;
        }

        .step-name { font-weight: 700; color: var(--primary-color); }
        .step-order { color: var(--text-muted); font-size: 0.8rem; margin-left: 4px;}
        .work-code-text { color: var(--text-main); font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 0.85rem; font-weight: 600; }

        .date-input {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.85rem;
            width: 100%;
            outline: none;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
        }
        .date-input:focus, .date-input:hover:not(:disabled) {
            border: 1px solid var(--primary-color);
            background-color: #f8fafc;
        }
        .date-input:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .gantt-bar-wrapper {
            position: absolute;
            height: 26px; 
            top: 9px;
            border-radius: 4px;
            z-index: 5;
            transition: box-shadow 0.2s;
        }
        .gantt-bar-wrapper.can-edit { cursor: pointer; }

        .bar-planned {
            position: absolute;
            left: 0; top: 0; height: 100%; width: 100%;
            background-color: var(--bar-planned);
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            z-index: 1;
            box-sizing: border-box;
        }

        .bar-actual {
            position: absolute;
            left: 0; top: 0; height: 100%;
            background-color: var(--bar-actual);
            border-radius: 4px;
            z-index: 2;
        }

        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            z-index: 3;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: bold;
            line-height: 26px;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }
        
        .bar-text.low-percent {
            color: var(--text-main);
            text-shadow: none;
        }

        .gantt-bar-wrapper.is-editing {
            z-index: 15 !important;
            box-shadow: 0 0 0 2px var(--warning-color), 0 4px 10px rgba(245, 158, 11, 0.3);
            cursor: move;
        }

        .gantt-bar-wrapper.is-editing .bar-planned {
            background-color: #fef3c7;
            border-color: var(--warning-color);
        }

        .resize-handle {
            position: absolute;
            top: 0;
            width: 12px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.5);
            display: none;
            z-index: 10;
        }
        .resize-handle-left { left: 0; cursor: ew-resize; border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
        .resize-handle-right { right: 0; cursor: ew-resize; border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
        .gantt-bar-wrapper.is-editing .resize-handle { display: block; }

        #save-bar {
            position: fixed;
            bottom: -100px;
            left: 0;
            width: 100%;
            background: var(--warning-color);
            color: #ffffff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999999;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
        }
        #save-bar.show { bottom: 0; }
        
        .custom-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 8px;
            background: #f8fafc;
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            cursor: pointer;
        }
        .custom-toggle input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

        .btn-hide-row {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            font-size: 1.1rem;
        }
        .btn-hide-row:hover { color: var(--danger-color); }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            
            body { background: #ffffff !important; padding: 0 !important; }
            .dashboard-container.no-print, .filter-header, .filter-grid, #save-bar, .btn-hide-row, .no-print { display: none !important; }
            
            #ganttCardWrapper { border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; }
            .gantt-container { overflow: visible !important; max-height: none !important; border: none !important; }
            .gantt-table { width: 100% !important; border-collapse: collapse !important; }
            
            .gantt-table th, .gantt-table td, 
            .col-step, .col-code, .col-progress, .col-start, .col-end, .date-header {
                position: static !important; 
                background-color: #ffffff !important;
                color: #000000 !important;
                border: 1px solid #94a3b8 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .gantt-table thead th { background-color: #e2e8f0 !important; }
            .date-input { border: none !important; }
            
            .bar-planned { background-color: #cbd5e1 !important; border: 1px solid #64748b !important; }
            .bar-actual { background-color: #2563eb !important; }
            .bar-text { color: #000 !important; text-shadow: none !important; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container no-print">
        <div class="filter-header">
            <div class="filter-title">
                <i class="fa-solid fa-chart-gantt fs-4"></i> JAGUAR GANTT CHART
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <div class="sync-status" id="syncIndicator" style="display:none;"></div>
                
                <a href="https://paiboon-creater.github.io/Data_Information_Jaguar_productions/" class="btn-action" style="text-decoration: none;">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                
                <button class="btn-action" id="btn-toggle-date" onclick="toggleDateColumns()">
                    <i class="fa-solid fa-eye-slash"></i> ซ่อนวันที่
                </button>

                <button class="btn-action" onclick="forceSync()">
                    <i class="fa-solid fa-rotate"></i> รีเฟรชข้อมูล
                </button>
                <button class="btn-action btn-login" id="btn-login" onclick="toggleLogin()">
                    <i class="fa-solid fa-lock"></i> Login แก้ไขแผน
                </button>
            </div>
        </div>
        <div class="filter-grid">
            <div class="filter-group">
                <label>ช่วงเวลาเริ่ม (Date From):</label>
                <input type="date" id="filter_date_from" class="form-select-stock" onchange="applyFilters()">
            </div>
            <div class="filter-group">
                <label>ช่วงเวลาถึง (Date To):</label>
                <input type="date" id="filter_date_to" class="form-select-stock" onchange="applyFilters()">
            </div>
            <div class="filter-group">
                <label>Order No:</label>
                <select id="filter_order" class="form-select-stock" onchange="applyFilters()">
                    <option value="">-- All Orders --</option>
                </select>
            </div>
            <div class="filter-group">
                <label>หมายเลข PO (PO No):</label>
                <select id="filter_po" class="form-select-stock" onchange="applyFilters()">
                    <option value="">-- All PO --</option>
                </select>
            </div>
            <div class="filter-group">
                <label>รหัสสินค้า (Product Code):</label>
                <select id="filter_work" class="form-select-stock" onchange="applyFilters()">
                    <option value="">-- All Products --</option>
                </select>
            </div>
            <div class="filter-group" style="flex: 2; min-width: 250px;">
                <label>ขั้นตอน (Step) - เลือกได้หลายรายการ:</label>
                <select id="filter_step" class="form-select-stock select2-multiple" multiple="multiple">
                    <!-- Options populated via JS -->
                </select>
            </div>
            <div class="filter-group" style="display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;">
                <div style="display: flex; gap: 6px;">
                    <div class="custom-toggle" style="flex: 1;">
                        <input type="checkbox" id="chk-recent-only" checked onchange="applyFilters()">
                        <label for="chk-recent-only" style="margin:0; font-size:0.75rem; cursor:pointer;">อัปเดต 5วัน</label>
                    </div>
                    <div class="custom-toggle" style="flex: 1;">
                        <input type="checkbox" id="chk-show-daily" onchange="applyFilters()">
                        <label for="chk-show-daily" style="margin:0; font-size:0.75rem; cursor:pointer;">ยอดรายวัน</label>
                    </div>
                </div>
                <button class="btn-action w-100 justify-content-center" onclick="clearFilters()" style="height: 34px;">เคลียร์ตัวกรอง</button>
            </div>
        </div>
    </div>

    <!-- แผงแสดงตารางแกนต์ชาร์ต -->
    <div class="dashboard-container" id="ganttCardWrapper" style="padding: 0;">
        <div class="gantt-header" style="padding: 15px 15px 0 15px;">
            <div class="gantt-title" id="ganttChartTitle"><i class="fa-solid fa-list text-primary me-2"></i> ภาพรวมแผนงาน</div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="gantt-legend no-print">
                    <div class="legend-item"><div class="box-planned"></div> แผนงาน (Plan)</div>
                    <div class="legend-item"><div class="box-actual"></div> ผลิตจริง (Actual)</div>
                </div>
                <div style="display: flex; gap: 8px;" class="no-print">
                    <button class="btn-action btn-primary-action" onclick="toggleFullscreen()" id="btn-fullscreen" title="ขยายเต็มจอเพื่อดูหรือสั่งพิมพ์">
                        <i class="fa-solid fa-expand"></i> ดูเต็มจอ
                    </button>
                    <button class="btn-action btn-print" onclick="window.print()" title="พิมพ์แกนต์ชาร์ตหน้าจอปัจจุบัน">
                        <i class="fa-solid fa-print"></i> พิมพ์เอกสาร
                    </button>
                </div>
            </div>
        </div>
        
        <div class="gantt-container" id="ganttScrollArea" style="margin: 15px; width: auto; max-height: 65vh;">
            <table class="gantt-table" id="ganttTable">
                <thead id="ganttHead"></thead>
                <tbody id="ganttBody">
                    <tr>
                        <td colspan="6" class="text-center py-5 text-muted fs-5">
                            <i class="fa-solid fa-spinner fa-spin me-2"></i> กำลังโหลดข้อมูล...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="save-bar">
        <div class="d-flex align-items-center gap-3">
            <i class="fa-solid fa-triangle-exclamation fs-3"></i>
            <div>
                <h6 class="mb-0 fw-bold">คุณมีการแก้ไขแผนงาน (Unsaved Changes)</h6>
                <small class="opacity-100">ลากแท่งกราฟ หรือเปลี่ยนวันที่ในตารางเพื่อแก้ไข</small>
            </div>
        </div>
        <div class="d-flex gap-2">
            <button onclick="cancelEdits()" class="btn btn-outline-light fw-bold">ยกเลิก</button>
            <button onclick="saveEdits()" class="btn btn-light fw-bold text-dark" id="btn-save-edits">
                <i class="fa-solid fa-floppy-disk me-1"></i> บันทึกแผนงาน
            </button>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
    const headers = { 
        "apikey": SUPABASE_KEY, 
        "Authorization": "Bearer " + SUPABASE_KEY, 
        "Content-Type": "application/json",
        "Prefer": "return=minimal" 
    };

    const supabaseClient = supabase.createClient(
        SUPABASE_URL.replace('/rest/v1', ''), 
        SUPABASE_KEY
    );

    const validUsers = {
        "admin": "112233", "user1": "@oh111", "user2": "@cat22",
        "user3": "@ann33", "user4": "@jai44", "user5": "@yuy55", "user6": "@boon6"
    };

    const STEP_ABBR_MAP = {
        "ตัดเหรียญมือ": "ตร.มือ", "ตัดเหรียญออโต": "ตร.ออโต", "ตัดมุม": "ตัดมุม", 
        "รีดใบ": "รีดใบ", "ตัดใบ": "ตัดใบ", "ตร.มือ": "ตร.มือ", "ตร.ออโต": "ตร.ออโต"
    };

    function getStepAbbr(name) {
        if(!name) return "";
        return STEP_ABBR_MAP[name.trim()] || name.trim();
    }

    function formatDateToLocal(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    let rawData = { orders: [], workItems: [], steps: [], targets: [], daily: [], orderSteps: [] };
    let maps = { workIdToCode: {}, stepIdToName: {}, targetIdToStepId: {}, workIdToStepIds: {}, stepLevel: {}, stepTargetLimit: {} };
    
    const CELL_WIDTH = 45; 
    let localEdits = {}; 
    let editingTaskId = null; 
    let currentMinDate = null; 
    let currentTotalDays = 0; 
    let isDateHidden = false; 
    
    let isLoggedIn = false;
    let currentUser = "";
    let initialRender = true;

    window.onload = async function() {
        $('#filter_step').select2({
            placeholder: "-- เลือกขั้นตอน --",
            allowClear: true,
            width: '100%'
        }).on('change', function(e) {
            if (e.originalEvent) applyFilters(); 
        });

        await fetchAllData();
        setupScrollTracking();
        setupRealtime();
    };

    function toggleFullscreen() {
        const wrapper = document.getElementById('ganttCardWrapper');
        const btn = document.getElementById('btn-fullscreen');
        wrapper.classList.toggle('fullscreen');
        
        if (wrapper.classList.contains('fullscreen')) {
            btn.innerHTML = '<i class="fa-solid fa-compress"></i> ย่อจอลง';
            btn.style.background = '#475569';
            btn.style.color = '#fff';
        } else {
            btn.innerHTML = '<i class="fa-solid fa-expand"></i> ดูเต็มจอ';
            btn.style.background = '';
            btn.style.color = '';
        }
    }

    function setupScrollTracking() {
        const scrollArea = document.getElementById('ganttScrollArea');
        scrollArea.addEventListener('scroll', (e) => {
            if (!initialRender) { 
                localStorage.setItem('jaguar_scroll_left', e.target.scrollLeft);
                localStorage.setItem('jaguar_scroll_top', e.target.scrollTop);
            }
        });
    }

    function restoreScrollPosition() {
        const scrollArea = document.getElementById('ganttScrollArea');
        const savedLeft = localStorage.getItem('jaguar_scroll_left');
        const savedTop = localStorage.getItem('jaguar_scroll_top');

        if (savedLeft !== null) scrollArea.scrollLeft = parseInt(savedLeft, 10);
        if (savedTop !== null) scrollArea.scrollTop = parseInt(savedTop, 10);
    }

    function setupRealtime() {
        supabaseClient
            .channel('db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'order_steps' }, payload => {
                if (Object.keys(localEdits).length === 0 && !editingTaskId) fetchAllData(true);
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'daily_production' }, payload => {
                if (Object.keys(localEdits).length === 0 && !editingTaskId) fetchAllData(true);
            })
            .subscribe();
    }

    function toggleLogin() {
        const btn = document.getElementById('btn-login');
        if (isLoggedIn) {
            isLoggedIn = false;
            currentUser = "";
            btn.innerHTML = '<i class="fa-solid fa-lock"></i> Login แก้ไขแผน';
            btn.classList.remove('btn-logout');
            btn.classList.add('btn-login');
            cancelEdits(); 
            alert("ออกจากระบบแก้ไขเรียบร้อยแล้ว");
        } else {
            let userInput = prompt("กรุณากรอก Username:");
            if (!userInput) return;
            let passInput = prompt("กรุณากรอก Password:");
            if (!passInput) return;

            if (validUsers[userInput] === passInput) {
                isLoggedIn = true;
                currentUser = userInput;
                btn.innerHTML = `<i class="fa-solid fa-unlock"></i> Logout (${currentUser})`;
                btn.classList.remove('btn-login');
                btn.classList.add('btn-logout');
                alert(`เข้าสู่ระบบสำเร็จ!`);
                applyFilters(); 
            } else {
                alert("Username หรือ Password ไม่ถูกต้อง!");
            }
        }
    }

    function toggleDateColumns() {
        isDateHidden = !isDateHidden;
        const table = document.getElementById('ganttTable');
        const btn = document.getElementById('btn-toggle-date');
        if (!table || !btn) return;

        if (isDateHidden) {
            table.classList.add('table-hide-dates');
            btn.innerHTML = '<i class="fa-solid fa-calendar-days"></i> แสดงวันที่';
        } else {
            table.classList.remove('table-hide-dates');
            btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> ซ่อนวันที่';
        }
    }

    async function forceSync() {
        const ind = document.getElementById('syncIndicator');
        ind.style.display = 'flex';
        ind.innerHTML = '<i class="fa-solid fa-arrows-rotate fa-spin"></i> SYNC';
        await fetchAllData();
        setTimeout(() => {
            ind.innerHTML = '<i class="fa-solid fa-circle-check"></i> SYNCED';
            setTimeout(() => { ind.style.display = 'none'; }, 2000);
        }, 500);
    }

    async function fetchAllData(isSilent = false) {
        try {
            const endpoints = [
                `${SUPABASE_URL}/orders?select=*`,
                `${SUPABASE_URL}/work_items?select=*`,
                `${SUPABASE_URL}/production_steps?select=*`,
                `${SUPABASE_URL}/targets?select=*`,
                `${SUPABASE_URL}/daily_production?select=id_order,id_target,produced_amount,record_date`,
                `${SUPABASE_URL}/order_steps?select=*`
            ];

            const responses = await Promise.all(endpoints.map(url => fetch(url, { headers, cache: 'no-store' })));
            const data = await Promise.all(responses.map(r => r.json()));

            rawData = {
                orders: data[0] || [],
                workItems: data[1] || [],
                steps: data[2] || [],
                targets: data[3] || [],
                daily: data[4] || [],
                orderSteps: data[5] || []
            };

            maps.workIdToCode = {};
            rawData.workItems.forEach(w => maps.workIdToCode[w.id_work] = w.work_code);

            maps.stepIdToName = {};
            maps.stepLevel = {};
            rawData.steps.forEach(s => {
                maps.stepIdToName[s.id_step] = s.step_name;
                maps.stepLevel[s.id_step] = s.level || 0;
            });

            populateFilters();
            renderGanttChart();
            restoreScrollPosition();
            initialRender = false;
        } catch (err) {
            console.error("Error fetching data:", err);
        }
    }

    function populateFilters() {
        const selOrder = document.getElementById('filter_order');
        const selPo = document.getElementById('filter_po');
        const selWork = document.getElementById('filter_work');
        const selStep = document.getElementById('filter_step');

        selOrder.innerHTML = '<option value="">-- All Orders --</option>';
        selPo.innerHTML = '<option value="">-- All PO --</option>';
        selWork.innerHTML = '<option value="">-- All Products --</option>';

        const currentStepVals = $('#filter_step').val() || [];

        const orders = [...new Set(rawData.orders.map(o => o.order_no).filter(Boolean))];
        orders.forEach(o => selOrder.innerHTML += `<option value="${o}">${o}</option>`);

        const pos = [...new Set(rawData.orders.map(o => o.po_no).filter(Boolean))];
        pos.forEach(p => selPo.innerHTML += `<option value="${p}">${p}</option>`);

        rawData.workItems.forEach(w => selWork.innerHTML += `<option value="${w.id_work}">${w.work_code}</option>`);

        selStep.innerHTML = '';
        rawData.steps.forEach(s => {
            selStep.innerHTML += `<option value="${s.id_step}">${s.step_name}</option>`;
        });
        $('#filter_step').val(currentStepVals).trigger('change.select2');
    }

    function applyFilters() {
        renderGanttChart();
    }

    function clearFilters() {
        document.getElementById('filter_date_from').value = '';
        document.getElementById('filter_date_to').value = '';
        document.getElementById('filter_order').value = '';
        document.getElementById('filter_po').value = '';
        document.getElementById('filter_work').value = '';
        $('#filter_step').val(null).trigger('change');
        document.getElementById('chk-recent-only').checked = true;
        document.getElementById('chk-show-daily').checked = false;
        renderGanttChart();
    }

    function renderGanttChart() {
        const tbody = document.getElementById('ganttBody');
        const thead = document.getElementById('ganttHead');

        if (!rawData.orderSteps || rawData.orderSteps.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">ไม่พบข้อมูลแผนงาน</td></tr>`;
            return;
        }

        let minDate = new Date();
        let maxDate = new Date();
        maxDate.setDate(maxDate.getDate() + 14);

        let dateCols = [];
        let curr = new Date(minDate);
        while (curr <= maxDate) {
            dateCols.push(new Date(curr));
            curr.setDate(curr.getDate() + 1);
        }

        let headHtml = `<tr>
            <th class="col-step">ขั้นตอน (Step)</th>
            <th class="col-code">Product Code</th>
            <th class="col-progress">ความคืบหน้า (%)</th>
            <th class="col-start">วันเริ่ม</th>
            <th class="col-end">วันเสร็จ</th>`;

        dateCols.forEach(d => {
            headHtml += `<th class="date-header">${d.getDate()}</th>`;
        });
        headHtml += `</tr>`;
        thead.innerHTML = headHtml;

        let bodyHtml = '';
        rawData.orderSteps.slice(0, 30).forEach(os => {
            const stepObj = rawData.steps.find(s => s.id_step === os.id_step) || {};
            const orderObj = rawData.orders.find(o => o.id_order === os.id_order) || {};
            const workObj = rawData.workItems.find(w => w.id_work === orderObj.id_work) || {};

            bodyHtml += `<tr>
                <td class="col-step text-start"><span class="step-name">${stepObj.step_name || 'Step ' + os.id_step}</span></td>
                <td class="col-code"><span class="work-code-text">${workObj.work_code || '-'}</span></td>
                <td class="col-progress">0%</td>
                <td class="col-start"><input type="date" class="date-input" value="${os.start_date || ''}" ${!isLoggedIn ? 'disabled' : ''}></td>
                <td class="col-end"><input type="date" class="date-input" value="${os.end_date || ''}" ${!isLoggedIn ? 'disabled' : ''}></td>`;
            
            dateCols.forEach(() => {
                bodyHtml += `<td></td>`;
            });
            bodyHtml += `</tr>`;
        });

        tbody.innerHTML = bodyHtml;
    }

    function cancelEdits() {
        localEdits = {};
        document.getElementById('save-bar').classList.remove('show');
        renderGanttChart();
    }

    async function saveEdits() {
        alert("บันทึกแผนงานเรียบร้อยแล้ว");
        document.getElementById('save-bar').classList.remove('show');
    }
</script>
