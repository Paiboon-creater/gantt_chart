<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAGUAR GANTT CHART // CLEAN THEME</title>
    
    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- jQuery & Select2 สำหรับสมาร์ทดรอปดาวน์ -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        :root {
            --bg-dark: #f0f2f5;
            --panel-bg: #ffffff;
            --border-dim: #cbd5e1;
            --text-main: #1e293b;
            --text-label: #475569;
            --text-muted: #64748b;
            
            --primary-color: #2563eb;     /* น้ำเงิน */
            --success-color: #10b981;     /* เขียว */
            --warning-color: #f59e0b;     /* ส้ม/เหลือง */
            --danger-color: #ef4444;      /* แดง */
            
            --input-bg: #f8fafc;
            --input-text: #0f172a;
            --table-bg: #ffffff;
            
            --bar-planned: #e2e8f0;        
            --bar-actual: #2563eb;        
            --cell-width: 45px; 
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        .dashboard-container {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .filter-title {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sync-status {
            font-size: 0.8rem;
            color: var(--success-color);
            display: flex;
            align-items: center;
            gap: 6px;
            background: #dcfce7;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--success-color);
        }

        .filter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-group {
            flex: 1;
            min-width: 150px;
        }

        .filter-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-label);
            margin-bottom: 4px;
        }

        /* ตกแต่ง Select2 Smart Dropdown */
        .select2-container--default .select2-selection--single {
            background-color: var(--input-bg);
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            height: 36px;
            display: flex;
            align-items: center;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: var(--input-text);
            font-size: 0.85rem;
            padding-left: 8px;
        }
        .select2-container--default .select2-selection--multiple {
            background-color: var(--input-bg);
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            min-height: 36px;
        }
        .select2-dropdown {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 0.85rem;
            border: 1px solid var(--primary-color);
        }
        .select2-container--default .select2-selection--multiple .select2-selection__choice {
            background-color: var(--primary-color);
            border: 1px solid var(--primary-color);
            color: #fff;
            border-radius: 3px;
            padding: 2px 6px;
        }

        .btn-action {
            background: #ffffff;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-action:hover {
            background: #f8fafc;

            border-color: var(--primary-color);

        .btn-primary-action {
            background: var(--primary-color);
            color: #ffffff;

        }
        .btn-primary-action:hover {
            background: #1d4ed8;

        .btn-print {

            color: #ffffff;

        }
        .btn-print:hover {
            background: #059669;
            color: #ffffff;
        }

        .gantt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .gantt-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .gantt-legend {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--text-label);
            font-weight: 500;
        }

        .legend-item { display: flex; align-items: center; gap: 6px; }
        .box-planned { width: 12px; height: 12px; background: var(--bar-planned); border: 1px solid #94a3b8; border-radius: 2px;}
        .box-actual { width: 12px; height: 12px; background: var(--bar-actual); border-radius: 2px;}

        #ganttCardWrapper {
            position: relative;
            background: var(--panel-bg);
            transition: all 0.3s ease;
        }
        #ganttCardWrapper.fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 99999 !important;
            padding: 15px !important;
            margin: 0 !important;
            border-radius: 0 !important;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
        }
        #ganttCardWrapper.fullscreen .gantt-container {
            max-height: calc(100vh - 90px) !important;
            flex: 1;
        }

        .gantt-container {
            width: 100%;
            overflow: auto;
            border: 1px solid var(--border-dim);
            background: var(--table-bg);
            max-height: 70vh;
            position: relative;
            border-radius: 6px;
        }

        .gantt-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        .gantt-table th, .gantt-table td {
            border: 1px solid #e2e8f0;
            padding: 4px 8px;
            text-align: center;
            color: var(--text-main);
            font-size: 0.85rem;
            height: 45px; 
            white-space: nowrap;
            box-sizing: border-box;
            position: relative;
        }

        .gantt-table th {
            position: sticky;
            top: -1px; 
            z-index: 20; 
            background-color: #f1f5f9;
            font-weight: 600;
            user-select: none;
        }

        /* ปุ่มปรับขนาดคอลัมน์ (Resizer Handle) */
        .col-resizer {
            position: absolute;
            right: 0;
            top: 0;
            width: 5px;
            height: 100%;
            cursor: col-resize;
            z-index: 40;
        }
        .col-resizer:hover, .col-resizer.resizing {
            background-color: var(--primary-color);
        }

        .col-step { position: sticky; left: 0; background-color: #ffffff; z-index: 11; min-width: 250px; max-width: 400px; border-right: 2px solid var(--border-dim); }
        .col-code { position: sticky; left: 250px; background-color: #ffffff; z-index: 11; text-align: left; min-width: 170px; max-width: 300px; border-right: 2px solid var(--border-dim); }
        .col-progress { position: sticky; left: 420px; background-color: #ffffff; z-index: 11; text-align: center; min-width: 260px; max-width: 350px; border-right: 2px solid var(--border-dim); }
        .col-start { position: sticky; left: 680px; background-color: #ffffff; z-index: 11; text-align: center; min-width: 115px; max-width: 200px; border-right: 1px solid var(--border-dim); }
        .col-end { position: sticky; left: 795px; background-color: #ffffff; z-index: 11; text-align: center; min-width: 115px; max-width: 200px; border-right: 2px solid var(--border-dim); }

        .gantt-table thead .col-step, 
        .gantt-table thead .col-code, 
        .gantt-table thead .col-progress,
        .gantt-table thead .col-start,
        .gantt-table thead .col-end {
            z-index: 30; 
            background-color: #e2e8f0;
            color: #0f172a;
        }

        tr:hover td.col-step, 
        tr:hover td.col-code, 
        tr:hover td.col-progress,
        tr:hover td.col-start,
        tr:hover td.col-end { background-color: #f8fafc; }

        .table-hide-dates .col-start,
        .table-hide-dates .col-end { display: none !important; }
        .table-hide-dates .col-progress { border-right: 2px solid var(--border-dim) !important; }

        .date-header {
            min-width: var(--cell-width) !important;
            max-width: var(--cell-width) !important;
            width: var(--cell-width) !important;
            padding: 6px 0 !important;
            background-color: #f1f5f9;
            color: #475569;
            font-size: 0.8rem;
            position: sticky;
            top: -1px;
            z-index: 20;
        }

        .step-name { font-weight: 700; color: var(--primary-color); }
        .work-code-text { color: var(--text-main); font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 0.85rem; font-weight: 600; }

        .date-input {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.85rem;
            width: 100%;
            outline: none;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
        }
        .date-input:focus, .date-input:hover {
            border: 1px solid var(--primary-color);
            background-color: #f8fafc;
        }

        #save-bar {
            position: fixed;
            bottom: -100px;
            left: 0;
            width: 100%;
            background: var(--warning-color);
            color: #ffffff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999999;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
        }
        #save-bar.show { bottom: 0; }
        
        .custom-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 8px;
            background: #f8fafc;
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            cursor: pointer;
            height: 36px;
            box-sizing: border-box;
        }
        .custom-toggle input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { background: #ffffff !important; padding: 0 !important; }
            .dashboard-container.no-print, .filter-header, .filter-grid, #save-bar, .no-print { display: none !important; }
            #ganttCardWrapper { border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; }
            .gantt-container { overflow: visible !important; max-height: none !important; border: none !important; }
            .gantt-table { width: 100% !important; border-collapse: collapse !important; }
            .gantt-table th, .gantt-table td { position: static !important; background-color: #ffffff !important; color: #000000 !important; border: 1px solid #94a3b8 !important; }
        }
    </style>
</head>
<body>

<script>
    const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
    const headers = { 
        "apikey": SUPABASE_KEY, 
        "Authorization": "Bearer " + SUPABASE_KEY, 
        "Content-Type": "application/json",
        "Prefer": "return=minimal" 
    };

    const supabaseClient = supabase.createClient(
        SUPABASE_URL.replace('/rest/v1', ''), 
        SUPABASE_KEY
    );

    let rawData = { orders: [], workItems: [], steps: [], targets: [], daily: [], orderSteps: [] };
    let maps = { workIdToCode: {}, stepIdToName: {} };
    
    let localEdits = {}; 
    let isDateHidden = false; 
    let initialRender = true;

    window.onload = async function() {
        // เปิดใช้งาน Smart Dropdowns (Select2) ทุกช่อง
        $('.select2-single').select2({ placeholder: "-- เลือก --", allowClear: true, width: '100%' });
        $('#filter_step').select2({ placeholder: "-- เลือกขั้นตอน --", allowClear: true, width: '100%' });

        $('.select2-single, #filter_step').on('change', function(e) {
            if (e.originalEvent) applyFilters(); 
        });

        await fetchAllData();
        setupScrollTracking();
        setupRealtime();
    };

    function initResizableColumns() {
        const table = document.getElementById('ganttTable');
        const headers = table.querySelectorAll('th');

        headers.forEach(th => {
            if (th.querySelector('.col-resizer')) return;

            const resizer = document.createElement('div');
            resizer.classList.add('col-resizer');
            th.appendChild(resizer);

            let startX, startWidth;

            resizer.addEventListener('mousedown', function(e) {
                startX = e.clientX;
                startWidth = th.offsetWidth;
                resizer.classList.add('resizing');

                function onMouseMove(e) {
                    const width = startWidth + (e.clientX - startX);
                    if (width > 50) {
                        th.style.width = width + 'px';
                        th.style.minWidth = width + 'px';
                        th.style.maxWidth = width + 'px';
                    }
                }

                function onMouseUp() {
                    resizer.classList.remove('resizing');
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                e.stopPropagation();
            });
        });
    }

    function toggleFullscreen() {
        const wrapper = document.getElementById('ganttCardWrapper');
        const btn = document.getElementById('btn-fullscreen');
        wrapper.classList.toggle('fullscreen');
        
        if (wrapper.classList.contains('fullscreen')) {
            btn.innerHTML = '<i class="fa-solid fa-compress"></i> ย่อจอลง';
            btn.style.background = '#475569';
            btn.style.color = '#fff';
        } else {
            btn.innerHTML = '<i class="fa-solid fa-expand"></i> ดูเต็มจอ';
            btn.style.background = '';
            btn.style.color = '';
        }
    }

    function setupScrollTracking() {
        const scrollArea = document.getElementById('ganttScrollArea');
        scrollArea.addEventListener('scroll', (e) => {
            if (!initialRender) { 
                localStorage.setItem('jaguar_scroll_left', e.target.scrollLeft);
                localStorage.setItem('jaguar_scroll_top', e.target.scrollTop);
            }
        });
    }

    function restoreScrollPosition() {
        const scrollArea = document.getElementById('ganttScrollArea');
        const savedLeft = localStorage.getItem('jaguar_scroll_left');
        const savedTop = localStorage.getItem('jaguar_scroll_top');

        if (savedLeft !== null) scrollArea.scrollLeft = parseInt(savedLeft, 10);
        if (savedTop !== null) scrollArea.scrollTop = parseInt(savedTop, 10);
    }

    function setupRealtime() {
        supabaseClient
            .channel('db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'order_steps' }, payload => {
                if (Object.keys(localEdits).length === 0) fetchAllData(true);
            })
            .subscribe();
    }

    function toggleDateColumns() {
        isDateHidden = !isDateHidden;
        const table = document.getElementById('ganttTable');
        const btn = document.getElementById('btn-toggle-date');
        if (!table || !btn) return;

        if (isDateHidden) {
            table.classList.add('table-hide-dates');
            btn.innerHTML = '<i class="fa-solid fa-calendar-days"></i> แสดงวันที่';
        } else {
            table.classList.remove('table-hide-dates');
            btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> ซ่อนวันที่';
        }
    }

    async function forceSync() {
        const ind = document.getElementById('syncIndicator');
        ind.style.display = 'flex';
        ind.innerHTML = '<i class="fa-solid fa-arrows-rotate fa-spin"></i> SYNC';
        await fetchAllData();
        setTimeout(() => {
            ind.innerHTML = '<i class="fa-solid fa-circle-check"></i> SYNCED';
            setTimeout(() => { ind.style.display = 'none'; }, 2000);
        }, 500);
    }

    async function fetchAllData() {
        try {
            // ดึงเฉพาะ Orders ที่ยังไม่ปิดงาน (is_closed = false)
            const endpoints = [
                `${SUPABASE_URL}/orders?select=*&is_closed=eq.false`,
                `${SUPABASE_URL}/work_items?select=*`,
                `${SUPABASE_URL}/production_steps?select=*`,
                `${SUPABASE_URL}/targets?select=*`,
                `${SUPABASE_URL}/daily_production?select=id_order,id_target,produced_amount,record_date`,
                `${SUPABASE_URL}/order_steps?select=*`
            ];

            const responses = await Promise.all(endpoints.map(url => fetch(url, { headers, cache: 'no-store' })));
            const data = await Promise.all(responses.map(r => r.json()));

            rawData = {
                orders: data[0] || [],
                workItems: data[1] || [],
                steps: data[2] || [],
                targets: data[3] || [],
                daily: data[4] || [],
                orderSteps: data[5] || []
            };

            // กรอง orderSteps เฉพาะ id_order ที่สอดคล้องกับ orders ที่ยังเปิดอยู่
            const activeOrderIds = new Set(rawData.orders.map(o => o.id_order));
            rawData.orderSteps = rawData.orderSteps.filter(os => activeOrderIds.has(os.id_order));

            maps.workIdToCode = {};
            rawData.workItems.forEach(w => maps.workIdToCode[w.id_work] = w.work_code);

            maps.stepIdToName = {};
            rawData.steps.forEach(s => maps.stepIdToName[s.id_step] = s.step_name);

            populateFilters();
            renderGanttChart();
            restoreScrollPosition();
            initialRender = false;
        } catch (err) {
            console.error("Error fetching data:", err);
            document.getElementById('ganttBody').innerHTML = `<tr><td colspan="6" class="text-danger text-center py-4">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
        }
    }

    function populateFilters() {
        const selOrder = document.getElementById('filter_order');
        const selPo = document.getElementById('filter_po');
        const selWork = document.getElementById('filter_work');
        const selStep = document.getElementById('filter_step');

        const currentOrder = $('#filter_order').val();
        const currentPo = $('#filter_po').val();
        const currentWork = $('#filter_work').val();
        const currentStepVals = $('#filter_step').val() || [];

        selOrder.innerHTML = '<option value="">-- All Orders --</option>';
        selPo.innerHTML = '<option value="">-- All PO --</option>';
        selWork.innerHTML = '<option value="">-- All Products --</option>';

        rawData.orders.forEach(o => {
            if (o.order_no) selOrder.innerHTML += `<option value="${o.order_no}">${o.order_no}</option>`;
            if (o.po_no) selPo.innerHTML += `<option value="${o.po_no}">${o.po_no}</option>`;
        });

        rawData.workItems.forEach(w => selWork.innerHTML += `<option value="${w.id_work}">${w.work_code}</option>`);

        selStep.innerHTML = '';
        rawData.steps.forEach(s => {
            selStep.innerHTML += `<option value="${s.id_step}">${s.step_name}</option>`;
        });

        // คืนค่าฟิลเตอร์ที่เคยเลือกไว้
        $('#filter_order').val(currentOrder).trigger('change.select2');
        $('#filter_po').val(currentPo).trigger('change.select2');
        $('#filter_work').val(currentWork).trigger('change.select2');
        $('#filter_step').val(currentStepVals).trigger('change.select2');
    }

    function applyFilters() {
        renderGanttChart();
    }

    function clearFilters() {
        document.getElementById('filter_date_from').value = '';
        document.getElementById('filter_date_to').value = '';
        $('#filter_order').val(null).trigger('change');
        $('#filter_po').val(null).trigger('change');
        $('#filter_work').val(null).trigger('change');
        $('#filter_step').val(null).trigger('change');
        renderGanttChart();
    }

    function renderGanttChart() {
        const tbody = document.getElementById('ganttBody');
        const thead = document.getElementById('ganttHead');

        if (!rawData.orderSteps || rawData.orderSteps.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">ไม่พบข้อมูลแผนงาน</td></tr>`;
            return;
        }

        let filteredSteps = rawData.orderSteps.filter(os => {
            const orderObj = rawData.orders.find(o => o.id_order === os.id_order) || {};
            const workObj = rawData.workItems.find(w => w.id_work === orderObj.id_work) || {};

            const fDateFrom = document.getElementById('filter_date_from').value;
            const fDateTo = document.getElementById('filter_date_to').value;
            const fOrder = $('#filter_order').val();
            const fPo = $('#filter_po').val();
            const fWork = $('#filter_work').val();
            const fSteps = $('#filter_step').val() || [];

            if (fOrder && orderObj.order_no !== fOrder) return false;
            if (fPo && orderObj.po_no !== fPo) return false;
            if (fWork && String(orderObj.id_work) !== String(fWork)) return false;
            if (fSteps.length > 0 && !fSteps.includes(String(os.id_step))) return false;

            if (fDateFrom && os.end_date && os.end_date < fDateFrom) return false;
            if (fDateTo && os.start_date && os.start_date > fDateTo) return false;

            return true;
        });

        let minDate = new Date();
        let maxDate = new Date();
        maxDate.setDate(maxDate.getDate() + 14);

        let dateCols = [];
        let curr = new Date(minDate);
        while (curr <= maxDate) {
            dateCols.push(new Date(curr));
            curr.setDate(curr.getDate() + 1);
        }

        let headHtml = `<tr>
            <th class="col-step">ขั้นตอน (Step)</th>
            <th class="col-code">Product Code</th>
            <th class="col-progress">ความคืบหน้า (%)</th>
            <th class="col-start">วันเริ่ม</th>
            <th class="col-end">วันเสร็จ</th>`;

        dateCols.forEach(d => {
            headHtml += `<th class="date-header">${d.getDate()}</th>`;
        });
        headHtml += `</tr>`;
        thead.innerHTML = headHtml;

        let bodyHtml = '';
        filteredSteps.forEach(os => {
            const stepObj = rawData.steps.find(s => s.id_step === os.id_step) || {};
            const orderObj = rawData.orders.find(o => o.id_order === os.id_order) || {};
            const workObj = rawData.workItems.find(w => w.id_work === orderObj.id_work) || {};

            const startDateVal = localEdits[os.id_plan_step]?.start_date || os.start_date || '';
            const endDateVal = localEdits[os.id_plan_step]?.end_date || os.end_date || '';

            bodyHtml += `<tr>
                <td class="col-step text-start"><span class="step-name">${stepObj.step_name || 'Step ' + os.id_step}</span></td>
                <td class="col-code"><span class="work-code-text">${workObj.work_code || '-'}</span></td>
                <td class="col-progress">0%</td>
                <td class="col-start"><input type="date" class="date-input" value="${startDateVal}" onchange="handleDateChange(${os.id_plan_step}, 'start_date', this.value)"></td>
                <td class="col-end"><input type="date" class="date-input" value="${endDateVal}" onchange="handleDateChange(${os.id_plan_step}, 'end_date', this.value)"></td>`;
            
            dateCols.forEach(() => {
                bodyHtml += `<td></td>`;
            });
            bodyHtml += `</tr>`;
        });

        tbody.innerHTML = bodyHtml || `<tr><td colspan="6" class="text-center py-4 text-muted">ไม่พบข้อมูลตามเงื่อนไขที่กรอง</td></tr>`;
        initResizableColumns();
    }

    function handleDateChange(idPlanStep, field, value) {
        if (!localEdits[idPlanStep]) {
            const original = rawData.orderSteps.find(o => o.id_plan_step === idPlanStep) || {};
            localEdits[idPlanStep] = { start_date: original.start_date, end_date: original.end_date };
        }
        localEdits[idPlanStep][field] = value;
        document.getElementById('save-bar').classList.add('show');
    }

    function cancelEdits() {
        localEdits = {};
        document.getElementById('save-bar').classList.remove('show');
        renderGanttChart();
    }

    async function saveEdits() {
        try {
            for (const [idPlanStep, edits] of Object.entries(localEdits)) {
                const response = await fetch(`${SUPABASE_URL}/order_steps?id_plan_step=eq.${idPlanStep}`, {
                    method: 'PATCH',
                    headers: headers,
                    body: JSON.stringify(edits)
                });
                if (!response.ok) throw new Error("Update failed");
            }

            alert("บันทึกแผนงานเรียบร้อยแล้ว");
            localEdits = {};
            document.getElementById('save-bar').classList.remove('show');
            await fetchAllData();
        } catch (err) {
            console.error("Save error:", err);
            alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง");
        }
    }
</script>
</body>
</html>
